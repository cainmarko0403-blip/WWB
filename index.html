var GLOSSARY = {
  "aromatization":{t:"Aromatization",d:"The process by which the enzyme aromatase converts androgens (like testosterone) into estrogen. Compounds that aromatize can cause estrogen-related effects \u2014 water retention, raised blood pressure, and gynecomastia \u2014 which is why an aromatase inhibitor is often run alongside them. Compounds that DON'T aromatize (most DHT-derivatives, trenbolone) can't raise estrogen this way.",also:["aromatize","aromatise","aromatizing","aromatising","aromatises","aromatizes","non-aromatizing","non-aromatising","aromatase"]},
  "estrogen":{t:"Estrogen",d:"The primary female sex hormone, present and necessary in men too. In the context of anabolic use, testosterone converting to estrogen (via aromatization) in excess causes water retention, high blood pressure, moodiness and gynecomastia \u2014 but too LITTLE estrogen (from over-using an aromatase inhibitor) wrecks joints, libido, mood and cholesterol. The goal is control, not elimination.",also:["estrogenic","estradiol","oestrogen"]},
  "aromatase inhibitor":{t:"Aromatase inhibitor (AI)",d:"A drug that blocks the aromatase enzyme, lowering estrogen. Used to control estrogenic side effects (bloat, gyno, high blood pressure) from aromatizing compounds. Examples here: anastrozole (Arimidex), exemestane (Aromasin), letrozole. Easy to overdo \u2014 crushing estrogen too low causes joint pain, low libido, bad lipids and low mood.",also:["aromatase inhibitors","ai"]},
  "prolactin":{t:"Prolactin",d:"A hormone best known for milk production, but relevant here because certain compounds \u2014 the 19-nortestosterone group (nandrolone/Deca, trenbolone) and other progestogenic steroids \u2014 can raise it. High prolactin causes low libido, erectile difficulty, and in some cases lactation or gyno-like tissue. It's the real culprit behind so-called 'deca dick', often mistaken for an estrogen problem. Managed with a dopamine agonist like cabergoline.",also:["prolactinemia","hyperprolactinemia"]},
  "progestogenic":{t:"Progestogenic (progestin) activity",d:"Some steroids activate the progesterone receptor in addition to the androgen receptor. This progestogenic activity \u2014 characteristic of the 19-nor family (nandrolone, trenbolone) \u2014 tends to raise prolactin and can worsen gyno and libido/erectile side effects even when estrogen is controlled. It's why running these compounds often needs prolactin management, not just estrogen management.",also:["progestogen","progestin","progestins","progesterone"]},
  "gynecomastia":{t:"Gynecomastia ('gyno')",d:"Growth of breast tissue in men, driven by an estrogen-to-androgen imbalance and/or high prolactin. Presents as a lump or tenderness behind the nipple. Prevented by controlling estrogen (aromatase inhibitor) and, for 19-nor compounds, prolactin (cabergoline). Established tissue often won't reverse without a SERM or, ultimately, surgery \u2014 so prevention beats treatment.",also:["gyno"]},
  "19-nortestosterone":{t:"19-nortestosterone (19-nor)",d:"A family of anabolic steroids missing the carbon-19 methyl group of testosterone. That single change makes them powerfully anabolic but also progestogenic (prolactin-raising) and, in the case of nandrolone, still mildly aromatizing. The group includes nandrolone (Deca, NPP), trenbolone, and trestolone (MENT). Known for strong mass gains but demanding recovery and prolactin management.",also:["19-nor","19 nor","nortestosterone","nandrolone derivative"]},
  "dht":{t:"DHT (dihydrotestosterone) & DHT-derivatives",d:"DHT is a potent androgen your body makes from testosterone via 5-alpha-reductase. DHT-derived steroids (Masteron, Primobolan, Winstrol, Anavar, Anadrol, DHB) are built on this backbone \u2014 they don't aromatize to estrogen, so they give dry, hard gains without bloat. The trade-off: DHT-type compounds can accelerate male-pattern hair loss and prostate effects in those predisposed.",also:["dht-derived","dht-derivative","dht derivative","dihydrotestosterone","dht-type"]},
  "hepatotoxic":{t:"Hepatotoxicity (liver strain)",d:"Toxicity to the liver. Oral steroids that are 17-alpha-alkylated (most oral androgens) are structurally modified to survive digestion, and that same modification stresses the liver \u2014 raising liver enzymes and, with prolonged or high-dose use, risking real damage. It's why oral cycles are kept short (typically 4\u20136 weeks), why liver support and bloodwork matter, and why alcohol is a bad idea alongside them.",also:["hepatotoxicity","liver toxic","liver toxicity","17-alpha-alkylated","17\u03b1-alkylated","17aa","17-aa"]},
  "hematocrit":{t:"Hematocrit / red blood cells (RBC)",d:"Hematocrit is the proportion of your blood made up of red blood cells. Androgens \u2014 especially testosterone and boldenone (EQ) \u2014 stimulate RBC production. Too high and the blood thickens, raising the risk of clots, stroke and heart attack. Monitored on bloodwork; managed by dose reduction, hydration, and in some cases donating blood.",also:["red blood cell","red blood cells"," rbc","hematocrit","haematocrit","polycythemia"]},
  "pct":{t:"PCT (post-cycle therapy)",d:"A protocol run after a steroid cycle to restart the body's own testosterone production, which anabolic use suppresses. Typically uses SERMs (tamoxifen/Nolvadex, clomid) and sometimes hCG to kickstart the natural hormonal axis. Skipping PCT after a suppressive cycle can leave someone with prolonged low testosterone \u2014 fatigue, low libido, depression \u2014 while they recover, if they fully recover at all.",also:["post-cycle therapy","post cycle therapy"]},
  "serm":{t:"SERM (selective estrogen receptor modulator)",d:"A drug that blocks estrogen in some tissues while allowing it in others. In this context, SERMs like tamoxifen (Nolvadex) and clomid are used to restart natural testosterone during PCT, and to treat or prevent gynecomastia. Unlike an aromatase inhibitor (which lowers estrogen everywhere), a SERM specifically blocks estrogen at the breast tissue and the brain's hormonal control center.",also:["serms","tamoxifen","nolvadex","clomid","clomiphene"]},
  "hcg":{t:"hCG (human chorionic gonadotropin)",d:"A hormone that mimics LH, the signal that tells the testes to produce testosterone. Run during a cycle, it keeps the testes active and prevents the shrinkage that suppression causes; run before PCT, it primes them to restart. Doesn't replace a full PCT but makes recovery smoother, especially after long or 19-nor-heavy cycles.",also:["human chorionic gonadotropin"]},
  "suppression":{t:"Suppression (of the HPTA)",d:"Anabolic steroids signal the brain that hormone levels are high, so it shuts down its own testosterone production \u2014 the hypothalamic-pituitary-testicular axis (HPTA) goes quiet. This is why cycles cause testicular shrinkage and low natural testosterone, and why PCT (and often hCG) is needed afterward. How fast and hard suppression hits varies by compound; 19-nors and MENT are notably fast and complete.",also:["suppressive","suppresses","suppressed","shuts you down","shut down","shutdown","hpta"]},
  "pip":{t:"PIP (post-injection pain)",d:"Soreness, swelling or stiffness at an injection site in the days after a shot. Caused by irritation from the oil, the concentration, high amounts of certain compounds crashing out of solution (DHB is notorious), or short esters like propionate. Managed with higher-quality carrier oil, dilution, warming the oil, smaller volumes per site, and rotating injection sites.",also:["post-injection pain","injection-site pain","injection site pain"]},
  "ester":{t:"Ester",d:"A chemical chain attached to a steroid that controls how slowly it releases after injection. Short esters (propionate, acetate) release fast \u2014 frequent injections, but they clear quickly if you need to stop. Long esters (enanthate, cypionate, decanoate, undecanoate) release slowly \u2014 fewer injections, but they linger for weeks. The ester changes only the timing, not the underlying compound or its A:A ratio.",also:["esters","short ester","long ester","short-ester","long-ester"]},
  "anabolic androgenic ratio":{t:"Anabolic : Androgenic (A:A) ratio",d:"A rating of a steroid's muscle-building (anabolic) activity versus its masculinizing (androgenic) activity, both measured against testosterone's baseline of 100:100. A high anabolic and low androgenic number (like nandrolone's ~125:37) suggests muscle growth with fewer androgenic side effects. But these numbers come from old animal assays and don't always predict real-world experience \u2014 treat them as a rough guide, not gospel.",also:["a:a ratio","anabolic:androgenic","anabolic to androgenic"]},
  "glp-1":{t:"GLP-1 (and GIP / glucagon) agonists",d:"GLP-1 receptor agonists (semaglutide, tirzepatide, retatrutide and relatives) mimic gut hormones that slow stomach emptying, curb appetite and improve blood-sugar control \u2014 producing significant weight loss. Tirzepatide adds GIP action; retatrutide adds glucagon. The main side effects are gastrointestinal (nausea, vomiting, constipation), worst early and minimized by titrating the dose up slowly.",also:["glp1","glp-1 agonist","gip","incretin"]},
  "titrate":{t:"Titrating the dose",d:"Starting low and increasing gradually over weeks rather than jumping to a full dose. With GLP-1 drugs this is essential \u2014 it's how you avoid the worst nausea and GI distress, letting the body adjust. Rushing the titration is the single most common reason people feel awful on these compounds.",also:["titration","titrating","titrate up","titrated"]},
  "igf-1":{t:"IGF-1 (insulin-like growth factor 1)",d:"A hormone, produced largely in the liver in response to growth hormone, that drives much of GH's muscle-and-tissue-building action. Used directly (as IGF-1 LR3) it's potent and anabolic \u2014 but it can cause hypoglycemia (dangerously low blood sugar), so users keep fast-acting carbohydrates on hand and monitor closely.",also:["igf1","igf-1 lr3","insulin-like growth factor"]},
  "secretagogue":{t:"GH secretagogue",d:"A compound that stimulates your own pituitary to release growth hormone, rather than being GH itself. Includes GHRH analogs (CJC-1295, sermorelin, tesamorelin) and GHRPs / ghrelin-mimetics (ipamorelin, GHRP-2/6, MK-677, hexarelin). Often paired GHRH-plus-GHRP for a larger, more natural GH pulse. Gentler and more physiological than injecting HGH directly.",also:["secretagogues","gh secretagogue","ghrh","ghrp","ghrp-2","ghrp-6"]},
  "lipolysis":{t:"Lipolysis (fat breakdown)",d:"The breakdown of stored fat into free fatty acids the body can burn for energy. Several compounds here are marketed for their lipolytic effect \u2014 the HGH fragment 176-191, AOD-9604, and the lipotropic injection blends. The real-world magnitude of these effects varies a lot and is often modest compared with the underlying diet.",also:["lipolytic","lipotropic","fat breakdown"]},
  "sarm":{t:"SARM (selective androgen receptor modulator)",d:"A non-steroidal compound that targets the ANDROGEN receptor \u2014 the same receptor testosterone uses \u2014 but is designed to act more on muscle and bone than on the prostate, skin and other tissues, aiming for muscle gains with fewer androgenic side effects. Examples here: ostarine (MK-2866), RAD-140, LGD-4033, S4, S23, YK-11. Despite being marketed as 'safer than steroids', they still suppress natural testosterone and have been linked to liver injury; most remain research chemicals without full human safety data. NOT the same as a SERM (which acts on the ESTROGEN receptor) \u2014 the names are one letter apart but they do different jobs.",also:["sarms","selective androgen receptor modulator"]},
  "myostatin":{t:"Myostatin",d:"A protein that puts a brake on muscle growth \u2014 it tells muscle to stop getting bigger. Compounds marketed as 'myostatin inhibitors' (follistatin, ACE-031, YK-11) aim to release that brake for more growth. In practice the human evidence is thin and the research-grade versions here are experimental.",also:["myostatin inhibitor","follistatin"]},
  "pde5 inhibitor":{t:"PDE5 inhibitor",d:"A drug that relaxes blood vessels to improve blood flow, used mainly for erectile function. Works by blocking the PDE5 enzyme so the vessels stay dilated. Examples here: sildenafil (Viagra), tadalafil (Cialis), vardenafil. The critical safety rule: NEVER combine with nitrates (heart/chest-pain medication) \u2014 the combination can drop blood pressure to fatal levels.",also:["pde5","pde-5","pde5 inhibitors"]},
  "androgen":{t:"Androgen",d:"A male sex hormone (testosterone and its relatives) responsible for masculine traits \u2014 muscle, strength, body/facial hair, libido, deepening voice. Anabolic steroids are synthetic androgens. 'Androgenic' side effects means the masculinizing ones: acne, hair loss (if predisposed), body hair, prostate effects, and \u2014 in women \u2014 virilization.",also:["androgens","androgenic","androgenicity"]},
  "anabolic":{t:"Anabolic vs androgenic vs catabolic",d:"'Anabolic' means tissue-BUILDING \u2014 the muscle-growth side of a steroid's action. 'Androgenic' means masculinizing (see Androgen). 'Catabolic' is the opposite of anabolic \u2014 tissue BREAKDOWN, which happens in a calorie deficit or under stress. 'Anti-catabolic' compounds help spare muscle from being broken down while dieting.",also:["catabolic","anti-catabolic","anabolism","catabolism"]},
  "peptide":{t:"Peptide",d:"A short chain of amino acids \u2014 smaller than a full protein \u2014 that acts as a signaling molecule in the body. The 'peptides' in this catalog are a broad group: some mimic hormones (GLP-1 drugs, GH secretagogues), some drive repair (BPC-157, TB-500), some are cosmetic (copper peptides). Because they're fragile, most are injected rather than swallowed, and many are research-grade with limited human data.",also:["peptides"]},
  "peptide bioavailability":{t:"Oral peptide bioavailability",d:"'Bioavailability' is how much of a dose actually reaches your bloodstream. Peptides swallowed as pills are mostly destroyed by stomach acid and digestion, so their oral bioavailability is low \u2014 which is why most peptides are injected. Oral peptide products work best for local gut effects (where they don't need to reach the bloodstream) rather than body-wide action.",also:["bioavailability","bioavailable"]},
  "ghrh":{t:"GHRH analog (e.g. CJC-1295, sermorelin, tesamorelin)",d:"GHRH = growth-hormone-releasing hormone, the natural signal that tells your pituitary to release growth hormone. GHRH analogs mimic that signal. They're often paired with a GHRP (a different, complementary trigger) for a bigger, more natural GH pulse than either alone \u2014 the classic 'GHRH + GHRP' combo.",also:["ghrh analog","growth-hormone-releasing hormone","growth hormone releasing hormone"]},
  "ghrp":{t:"GHRP / ghrelin mimetic (e.g. ipamorelin, GHRP-2/6, hexarelin, MK-677)",d:"GHRP = growth-hormone-releasing peptide. These trigger GH release through a second pathway (the ghrelin/hunger-hormone receptor), separate from GHRH. Combining a GHRP with a GHRH analog produces a larger, more natural GH pulse than either does alone. Some GHRPs also increase appetite.",also:["ghrp-2","ghrp-6","ghrelin","ghrelin mimetic","growth-hormone-releasing peptide"]},
  "growth hormone":{t:"Growth hormone (GH / HGH)",d:"A hormone from the pituitary that drives growth, tissue repair, fat metabolism and recovery. It can be injected directly (recombinant HGH / somatropin) or stimulated by secretagogues. Powerful for body composition, but real GH raises blood sugar and can cause water retention, joint aches and, with chronic misuse, organ/gut enlargement. Much of its muscle-building action works through IGF-1.",also:["hgh","somatropin","gh axis","gh-axis"]},
  "amylin":{t:"Amylin analog (e.g. cagrilintide)",d:"Amylin is a hormone released alongside insulin that promotes fullness and slows stomach emptying. Amylin analogs like cagrilintide curb appetite and are usually paired with a GLP-1 drug (semaglutide) for greater weight loss than either alone \u2014 the 'CagriSema' approach.",also:["amylin analog"]},
  "glucagon":{t:"Glucagon (in triple agonists)",d:"Glucagon is a hormone that raises blood sugar and increases energy expenditure. In newer weight-loss compounds (retatrutide, survodutide, mazdutite), adding glucagon-receptor action to GLP-1 boosts metabolic rate and fat loss on top of the appetite effects. Retatrutide is a 'triple agonist' \u2014 GLP-1 + GIP + glucagon.",also:["glucagon agonist","triple agonist","dual agonist"]},
  "nootropic":{t:"Nootropic",d:"A substance aimed at improving thinking, memory, focus or mood \u2014 a 'cognitive enhancer'. The nootropic peptides here (Semax, Selank, P21, Cerebrolysin, dihexa) are largely research-grade with mostly Russian/early-stage evidence; effects are usually subtle and individual.",also:["nootropics","cognitive enhancer"]},
  "anxiolytic":{t:"Anxiolytic",d:"Anxiety-reducing. Peptides like Selank are described as anxiolytic \u2014 they aim to calm without the sedation or dependence of benzodiazepines. Evidence is mostly early-stage.",also:["anxiolytics"]},
  "thyroid hormone":{t:"Thyroid hormone (T3 / T4)",d:"Thyroid hormones set your metabolic rate. T3 is the active form (fast, potent fat loss but also burns muscle and suppresses your own thyroid); T4 is the storage form your body converts to T3 as needed (gentler, slower). Using them for fat loss risks muscle loss, heart strain and \u2014 with T3 especially \u2014 the need to taper off rather than stop abruptly.",also:["thyroid"]},
  "epo":{t:"EPO (erythropoietin)",d:"A hormone that tells the body to make more red blood cells, boosting oxygen delivery and endurance. Powerful for stamina but dangerous: it thickens the blood, and pushed too far it raises the risk of clots, stroke and heart attack. Requires hematocrit monitoring.",also:["erythropoietin"]},
  "cardiovascular":{t:"Cardiovascular strain & blood lipids",d:"Many anabolic compounds stress the heart and blood vessels: they worsen cholesterol (lowering protective HDL, raising harmful LDL), can raise blood pressure, thicken the blood, and over time contribute to heart disease \u2014 the most serious long-term risk of steroid use. This is why bloodwork (a lipid panel especially) matters, and why 'harsh on lipids' is a genuine warning, not a footnote.",also:["cardiovascular strain","blood lipids","lipids","cholesterol","hdl","ldl"]},
  "blood pressure":{t:"Blood pressure (and its risks)",d:"Many compounds raise blood pressure \u2014 through water retention (from estrogen), blood thickening (raised hematocrit), or direct vascular effects. Chronically high blood pressure damages the heart, kidneys, eyes and arteries silently over time. Worth monitoring with a cheap home cuff during any cycle.",also:["hypertension"]},
  "hpta":{t:"HPTA (the body's testosterone control system)",d:"The hypothalamic-pituitary-testicular axis \u2014 the feedback loop between brain and testes that regulates natural testosterone. Anabolic steroids suppress it (the brain sees high hormone levels and stops signaling), which causes testicular shrinkage and low natural testosterone. Restarting it after a cycle is the whole point of PCT.",also:["hypothalamic-pituitary","hypothalamic pituitary"]},
  "gonadotropin":{t:"Gonadotropins (LH / FSH, and hCG / hMG)",d:"Gonadotropins are the pituitary signals (LH and FSH) that tell the testes to make testosterone and sperm. Anabolic use shuts these signals off. Products like hCG (mimics LH) and hMG (LH + FSH activity) replace them directly to keep the testes working during or after a cycle. Gonadorelin and kisspeptin act one step upstream to stimulate the body's own release.",also:["gonadotropins","lh","fsh","luteinizing hormone"]},
  "melanocortin":{t:"Melanocortin agonist (e.g. MT-1, MT-2, PT-141)",d:"Melanocortin receptors influence skin pigmentation (tanning) and sexual arousal. MT-1 and MT-2 ('melanotan') darken the skin; PT-141 (bremelanotide) targets libido. Common side effects include nausea, flushing, and darkening of moles/freckles \u2014 any changing mole should be checked.",also:["melanocortin agonist","melanotan"]},
  "insulin resistance":{t:"Insulin resistance / hypoglycemia",d:"Two blood-sugar concerns from different compounds. Growth hormone can cause insulin RESISTANCE \u2014 cells respond less to insulin, raising blood sugar over time. IGF-1 and insulin itself do the opposite \u2014 they can cause HYPOGLYCEMIA (dangerously LOW blood sugar), which comes on fast and can be an emergency; users keep fast carbs on hand. Either way, glucose control matters.",also:["insulin resistance","hypoglycemia","hypoglycemic","insulin sensitivity","blood sugar","glucose"]},
  "5-alpha-reductase":{t:"5-alpha-reductase (and hair loss)",d:"The enzyme that converts testosterone into the more potent DHT in tissues like the scalp, skin and prostate. In people genetically prone to male-pattern baldness, DHT is what shrinks the hair follicles. 5-alpha-reductase inhibitors (finasteride, dutasteride) block this conversion to protect hair \u2014 but can bring their own sexual/mood side effects.",also:["5-alpha-reductase","5-alpha reductase","5-ar","5ar","finasteride","dutasteride"]},
  "subcutaneous":{t:"Injection routes: subQ vs IM",d:"SubQ (subcutaneous) means into the fat layer just under the skin \u2014 a small, shallow injection used for most peptides and GLP-1 drugs. IM (intramuscular) means deep into a muscle \u2014 used for oil-based steroids. The route affects absorption speed and comfort; using the wrong one for a given compound can hurt or reduce effectiveness.",also:["subcutaneous","subq","sub-q","intramuscular"]},
  "eod":{t:"Dosing shorthand (ED / EOD / mcg / iu)",d:"Common abbreviations: ED = every day; EOD = every other day; mg = milligram; mcg = microgram (1000 mcg = 1 mg \u2014 mixing these up is a serious dosing error); iu = international unit (used for HGH, hCG, insulin). Short-ester compounds often need EOD dosing to keep levels stable.",also:["every other day"," iu ","microgram","milligram"]},
  "reconstitution":{t:"Reconstitution & diluents (BAC / AA water)",d:"Most peptides ship as a dried powder that must be mixed with a sterile liquid before injection \u2014 this is 'reconstitution'. Bacteriostatic water (BAC) contains a preservative so a vial can be used over several weeks; acetic-acid water (AA) is used for peptides (like some BPC forms) that won't dissolve otherwise. These are diluents, not drugs.",also:["reconstitute","reconstituted","bac water","bacteriostatic","diluent","aa water"]},
  "half-life":{t:"Half-life",d:"The time it takes for half of a compound to clear from your system. A short half-life means frequent dosing but quick clearance if you need to stop; a long half-life means infrequent dosing but the compound lingers for weeks. For injectable steroids the ester attached to the molecule largely sets the half-life.",also:["half life"]},
  "bioregulator":{t:"Khavinson bioregulators",d:"A family of very short peptides (Cortagen, Cardiogen, Vesugen and the other '-gen' names) developed by Russian researcher Vladimir Khavinson, each claimed to support a specific organ or tissue. The theory is intriguing but human evidence outside a small Russian body of work is limited \u2014 treat the organ-specific claims cautiously.",also:["bioregulators","khavinson"]},
  "telomere":{t:"Telomeres (and Epitalon)",d:"Telomeres are protective caps on the ends of chromosomes that shorten as cells divide and age. Epitalon (and its variants) is a peptide claimed to support the enzyme telomerase and thus 'anti-aging'. The idea draws on real biology, but the human longevity evidence is preliminary; there's also a theoretical caution that boosting telomerase could favor cancer cells.",also:["telomeres","telomerase"]},
  "senolytic":{t:"Senolytic (e.g. FOXO4-DRI)",d:"'Senolytics' aim to clear out senescent cells \u2014 old, damaged cells that stop dividing but linger and secrete inflammatory signals ('zombie cells'). Removing them is a leading anti-aging research idea. The compounds here (like FOXO4-DRI) are early-stage research chemicals with essentially no human safety data.",also:["senolytics","senescent"]},
  "mitochondrial":{t:"Mitochondrial peptides (MOTS-c, SS-31, etc.)",d:"Mitochondria are the energy factories inside your cells. Several peptides here (MOTS-c, SS-31/elamipretide, Humanin) target mitochondrial function for energy, metabolism and longevity aims. Interesting research area; human evidence is still developing.",also:["mitochondria","mitochondrion"]},
  "nad":{t:"NAD+ (and sirtuins)",d:"NAD+ is a coenzyme central to cellular energy production and DNA repair, and it declines with age. It also fuels 'sirtuins', enzymes linked to longevity. Supplementing NAD+ (injected, or via precursors) is a popular anti-aging strategy; injected NAD+ is the most strongly felt route but causes flushing and chest tightness if pushed too fast \u2014 go slow.",also:["nad+","sirtuin","sirtuins"]},
  "antioxidant":{t:"Antioxidant (e.g. glutathione)",d:"Antioxidants neutralize 'free radicals' \u2014 reactive molecules that damage cells over time (oxidative stress). Glutathione is the body's master antioxidant, also popular for skin brightening. Benefit is real against genuine oxidative stress or deficiency; the 'more is always better' framing is overstated.",also:["antioxidants","oxidative stress","free radical","glutathione"]},
  "immunomodulator":{t:"Immunomodulator (e.g. thymic peptides)",d:"A substance that adjusts immune activity \u2014 raising a weak response or calming an overactive one, rather than blindly stimulating. The thymic peptides here (Thymosin Alpha-1, Thymalin) are the best-studied examples, with real clinical use abroad for immune support and infection.",also:["immunomodulatory","immune modulator","immune-modulating","thymic"]},
  "priapism":{t:"Priapism (medical emergency)",d:"A persistent, often painful erection lasting more than about 4 hours, unrelated to arousal \u2014 a risk with injectable erectile agents like alprostadil (and rarely high-dose PDE5 drugs or PT-141). It's a genuine emergency: blood trapped in the penis starves the tissue of oxygen, and delay past a few hours can cause permanent damage. It needs immediate medical care.",also:[]},
  "serotonin syndrome":{t:"Serotonin syndrome",d:"A potentially dangerous build-up of serotonin activity \u2014 causing agitation, rapid heart rate, high temperature, tremor and confusion \u2014 that can occur when serotonergic drugs are combined. Relevant here because methylene blue is a potent MAO inhibitor: combined with SSRIs/SNRIs or other serotonergic drugs it can trigger this. A real drug-interaction caution, not a theoretical one.",also:["serotonergic","mao inhibitor","maoi"]},
  "receptor agonist":{t:"Agonist vs antagonist",d:"An 'agonist' is a key that fits a receptor and switches it ON (mimicking the body's natural signal); an 'antagonist' fits the same lock but blocks it, switching it OFF. Most performance compounds here are agonists (GLP-1 agonists, melanocortin agonists). A 'modulator' (like a SARM or SERM) is subtler \u2014 it can act as an agonist in some tissues and antagonist in others.",also:["agonist","antagonist","receptor"]},
  "analog":{t:"Analog",d:"A compound structurally similar to another, tweaked to change how it behaves \u2014 usually to last longer, hit harder, or target a tissue more selectively. For example, the GLP-1 drugs are analogs of a natural gut hormone, modified to resist breakdown so they work for a week per dose instead of minutes.",also:["analogue","analogs"]},
  "designer steroid":{t:"Designer steroid",d:"An anabolic steroid created by chemically tweaking a known one \u2014 historically to evade drug tests or laws. They tend to be under-studied, so their real potency and toxicity are less predictable than established compounds. Several potent orals here (Superdrol/methasterone, methylstenbolone) come from this lineage.",also:["designer steroids"]},
  "water retention":{t:"Water retention (bloat)",d:"Fluid held under the skin, usually driven by estrogen from aromatizing compounds. It causes a smooth, puffy look, can raise blood pressure, and masks muscle definition. Non-aromatizing compounds (most DHT-derivatives, trenbolone) stay 'dry' \u2014 no estrogenic water \u2014 which is why they're favored for a hard, defined look.",also:["water bloat","bloat","estrogenic water"]},
  "vasodilator":{t:"Vasodilation",d:"Widening of blood vessels, which improves blood flow and lowers blood pressure. It's how PDE5 inhibitors produce erections and why some compounds cause flushing or headaches. VIP ('vasoactive intestinal peptide') is named for this effect.",also:["vasodilation","vasoactive","vasodilators"]},
  "beta-2 agonist":{t:"Beta-2 agonist (e.g. clenbuterol, salbutamol)",d:"Drugs that activate beta-2 receptors \u2014 originally asthma medications \u2014 used off-label for fat loss because they slightly raise metabolic rate and promote fat burning. The catch is cardiac: they raise heart rate, can cause tremor, cramps and palpitations, and clenbuterol's long action makes it easy to overdo. Taurine and potassium help with cramps; the heart-rate effect is the thing to respect.",also:["beta-2","beta 2","beta-2 agonists"]},
  "antiparasitic":{t:"Antiparasitic / antimalarial",d:"Drugs that kill parasites (worms, mites) or malaria. Ivermectin and fenbendazole are antiparasitics; hydroxychloroquine is an antimalarial also used for autoimmune disease. All are legitimate, effective medicines for their real indications \u2014 the cautions arise mainly with high off-label doses and long-term use (e.g. eye toxicity with hydroxychloroquine).",also:["antiparasitics","antimalarial","antiparasitic"]},
  "relaxin":{t:"Relaxin analog (e.g. B7-33)",d:"Relaxin is a hormone involved in tissue remodeling and reducing fibrosis (scarring). Relaxin analogs like B7-33 are studied for anti-fibrotic effects in the heart and other organs. Very early-stage research with little human data \u2014 more a research curiosity than a practical tool right now.",also:["relaxin","anti-fibrotic","fibrosis"]},
  "copper peptide":{t:"Copper peptides (GHK-Cu, AHK-Cu)",d:"Peptides bound to copper, used for skin renewal, collagen production, wound healing and hair. GHK-Cu is the best known. Effective enough to be a genuine cosmetic ingredient \u2014 but the copper accumulates in the body, so these are meant to be cycled rather than run continuously.",also:["copper peptides","ghk-cu","collagen"]}

// Build a flat lookup of every linkable phrase -> canonical glossary key,
// longest phrases first so multi-word terms win over their component words.
var GLOSS_LOOKUP = [];
for (var gk in GLOSSARY){
  GLOSS_LOOKUP.push([gk, gk]);
  var also = GLOSSARY[gk].also || [];
  for (var ai=0; ai<also.length; ai++) GLOSS_LOOKUP.push([also[ai], gk]);
}
GLOSS_LOOKUP.sort(function(a,b){ return b[0].length - a[0].length; });

// Escape THEN linkify: because linkification runs on already-escaped text, it
// only ever sees safe plain text and can't damage existing tags. We tokenize so
// a term is never linked twice and never inside another link. Case-insensitive
// match; the visible text keeps its original casing.
function escGloss(s){
  var safe = esc(s);
  // find non-overlapping matches across the whole string
  var lowered = safe.toLowerCase();
  var marks = [];  // {start,end,key}
  for (var i=0;i<GLOSS_LOOKUP.length;i++){
    var phrase = GLOSS_LOOKUP[i][0], key = GLOSS_LOOKUP[i][1];
    var from = 0, idx;
    while ((idx = lowered.indexOf(phrase, from)) !== -1){
      var end = idx + phrase.length;
      // require a word boundary on each side so 'ai' doesn't match inside 'brain'
      var before = idx===0 ? " " : lowered.charAt(idx-1);
      var after  = end>=lowered.length ? " " : lowered.charAt(end);
      var isWord = function(c){ return /[a-z0-9]/.test(c); };
      var boundaryOK = !(isWord(before) && isWord(phrase.charAt(0))) &&
                       !(isWord(after) && isWord(phrase.charAt(phrase.length-1)));
      if (boundaryOK){
        // reject if this range overlaps an already-claimed (longer) match
        var clash=false;
        for (var m=0;m<marks.length;m++){ if (idx<marks[m].end && end>marks[m].start){ clash=true; break; } }
        if (!clash) marks.push({start:idx,end:end,key:key});
      }
      from = end;
    }
  }
  if (!marks.length) return safe;
  marks.sort(function(a,b){ return a.start-b.start; });
  var out="", cur=0;
  for (var j=0;j<marks.length;j++){
    var mk=marks[j];
    if (mk.start<cur) continue;   // safety: skip overlaps
    out += safe.slice(cur, mk.start);
    out += '<span class="glossLink" data-gk="'+esc(mk.key)+'">'+safe.slice(mk.start, mk.end)+'</span>';
    cur = mk.end;
  }
  out += safe.slice(cur);
  return out;
}

// ---- glossary popup + full glossary page ----
function openGlossPopup(key){
  var g = GLOSSARY[key];
  if (!g) return;
  var ov = document.getElementById("glossPop");
  ov.innerHTML =
    '<div class="glossCard" role="dialog" aria-modal="true">'+
      '<div class="glossCardHd">'+
        '<span class="glossCardTitle">'+esc(g.t)+'</span>'+
        '<button class="glossCardClose" id="glossPopClose" aria-label="Close">\u2715</button>'+
      '</div>'+
      '<div class="glossCardBody">'+esc(g.d)+'</div>'+
      '<button class="glossCardMore" id="glossPopMore">View full glossary \u2192</button>'+
    '</div>';
  ov.className = "glossPop";
  // tap the backdrop (not the card) to dismiss

// ============================================================
// CALCULATORS PAGE \u2014 reconstitution, draw volume, frequency, blend ratio.
// All math is done live from the inputs; nothing is stored. Rounding is only
// for display. U-100 insulin syringe convention: 100 units = 1 mL, so
// 1 unit = 0.01 mL. Peptide amounts are handled in mcg internally for
// precision (1 mg = 1000 mcg).
// ============================================================
function fmtNum(n, dp){
  if(!isFinite(n)) return "\u2014";
  if(dp===undefined) dp = (Math.abs(n)>=100?0 : Math.abs(n)>=10?1 : 2);
  var s = n.toFixed(dp);
  // trim trailing zeros but keep at least integer
  if(s.indexOf(".")>=0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s;
}
function calcVal(id){ var el=document.getElementById(id); if(!el) return NaN; var v=parseFloat(el.value); return isFinite(v)?v:NaN; }

// ---- live calculation ----
function calcRecalc(){
  // 1. recon forward
  (function(){
    var mg=calcVal("r1_mg"), ml=calcVal("r1_ml");
    var out=document.getElementById("r1_out"); if(!out) return;
    if(!(mg>0)||!(ml>0)){ out.innerHTML="Enter mg and mL."; return; }
    var uSel=document.getElementById("r1_unit"); var useMg=(uSel&&uSel.value==="mg");
    var mcgPerMl = mg*1000/ml;
    var mcgPerUnit = mcgPerMl*0.01;           // 1 unit = 0.01 mL
    // present the headline in the chosen unit; keep the other as reference
    var u = useMg ? "mg" : "mcg";
    var perUnit = useMg ? mcgPerUnit/1000 : mcgPerUnit;
    var per10   = useMg ? (mcgPerUnit*10)/1000 : mcgPerUnit*10;
    var perMl   = useMg ? mg/ml : mcgPerMl;
    out.innerHTML = '<b>'+fmtNum(perUnit)+' '+u+'</b> per unit'+
      '<span class="sub">= '+fmtNum(perMl, useMg?2:0)+' '+u+'/mL \u00b7 each 10 units = '+fmtNum(per10)+' '+u+
      ' \u00b7 ('+fmtNum(mg/ml,2)+' mg/mL = '+fmtNum(mcgPerMl,0)+' mcg/mL)</span>';
  })();
  // 2. recon reverse
  (function(){
    var mg=calcVal("r2_mg"), dose=calcVal("r2_dose"), units=calcVal("r2_units");
    var du=document.getElementById("r2_doseunit"); var unitMul=(du&&du.value==="mg")?1000:1;
    var out=document.getElementById("r2_out"); if(!out) return;
    var doseMcg=dose*unitMul;
    if(!(mg>0)||!(doseMcg>0)||!(units>0)){ out.innerHTML="Enter all three values."; return; }
    var totalMcg=mg*1000;
    var drawMl=units*0.01;                     // desired volume per dose
    var mlToAdd = totalMcg/doseMcg * drawMl;   // (doses in vial) \u00d7 volume per dose
    var conc = mg/ ( totalMcg/doseMcg * drawMl ); // mg/mL for reference
    if(!(mlToAdd>0)){ out.innerHTML="Check the numbers."; return; }
    out.innerHTML = 'Add <b>'+fmtNum(mlToAdd,2)+' mL</b> BAC water'+
      '<span class="sub">Then '+fmtNum(units)+' units = '+fmtNum(dose)+' '+(du?du.value:'mcg')+' \u00b7 vial concentration \u2248 '+fmtNum(conc,2)+' mg/mL \u00b7 doses per vial \u2248 '+fmtNum(totalMcg/doseMcg,0)+'</span>';
  })();
  // 3. draw volume
  (function(){
    var conc=calcVal("d_conc"), dose=calcVal("d_dose");
    var cu=document.getElementById("d_concunit"), du=document.getElementById("d_doseunit");
    var out=document.getElementById("d_out"); if(!out) return;
    var concMcgMl = conc * (cu&&cu.value==="mgml"?1000:1);
    var doseMcg = dose * (du&&du.value==="mg"?1000:1);
    if(!(concMcgMl>0)||!(doseMcg>0)){ out.innerHTML="Enter concentration and dose."; return; }
    var ml = doseMcg/concMcgMl;
    var units = ml/0.01;
    var over = ml>1;   // more than a full 1 mL / 100-unit syringe
    out.innerHTML = '<b>'+fmtNum(units,1)+' units</b> ('+fmtNum(ml,3)+' mL)'+
      '<span class="sub">on a U-100 syringe (10 units = 0.1 mL)'+(over?' \u2014 \u26a0 that\u2019s more than a full 1 mL / 100-unit syringe; split the draw or use less water':'')+'</span>';
  })();
  // 4. IU
  (function(){
    var iu=calcVal("i_iu"), ml=calcVal("i_ml"), dose=calcVal("i_dose");
    var out=document.getElementById("i_out"); if(!out) return;
    if(!(iu>0)||!(ml>0)){ out.innerHTML="Enter IU and water."; return; }
    var iuPerMl=iu/ml, iuPerUnit=iuPerMl*0.01;
    var s='<b>'+fmtNum(iuPerMl,0)+' IU/mL</b>'+'<span class="sub">each unit = '+fmtNum(iuPerUnit,1)+' IU';
    if(dose>0){ var units=dose/iuPerUnit; s+=' \u00b7 a '+fmtNum(dose,0)+' IU dose = '+fmtNum(units,1)+' units ('+fmtNum(dose/iuPerMl,3)+' mL)'; }
    s+='</span>';
    out.innerHTML=s;
  })();
  // 5. frequency
  (function(){
    var amt=calcVal("f_amt");
    var out=document.getElementById("f_out"); if(!out) return;
    var dir=window._calcDir||"w2d";
    var pw=window._calcPw||3.5;
    var unitEl=document.getElementById("f_unit"); var u=unitEl?unitEl.textContent:"mg";
    if(!(amt>0)){ out.innerHTML="Enter an amount."; return; }
    if(dir==="w2d"){
      out.innerHTML='<b>'+fmtNum(amt/pw,2)+' '+u+'</b> per injection'+
        '<span class="sub">'+fmtNum(amt)+' '+u+'/week split across '+fmtNum(pw,2)+' shots/week</span>';
    } else {
      out.innerHTML='<b>'+fmtNum(amt*pw,2)+' '+u+'</b> per week'+
        '<span class="sub">'+fmtNum(amt)+' '+u+' \u00d7 '+fmtNum(pw,2)+' shots/week</span>';
    }
  })();
  // 6. blend ratio
  (function(){
    var a=calcVal("b_a"), b=calcVal("b_b"), c=calcVal("b_c"), dose=calcVal("b_dose");
    var out=document.getElementById("b_out"); if(!out) return;
    if(!(a>0)||!(dose>0)){ out.innerHTML="Enter compound A\u2019s mg/mL and your dose."; return; }
    var ml=dose/a;                              // volume that delivers the A dose
    var bAmt=b>0?b*ml:0, cAmt=c>0?c*ml:0;
    var s='Draw <b>'+fmtNum(ml,3)+' mL</b>'+'<span class="sub">';
    var parts=['A: '+fmtNum(dose,1)+' mg'];
    if(b>0) parts.push('B: '+fmtNum(bAmt,1)+' mg');
    if(c>0) parts.push('C: '+fmtNum(cAmt,1)+' mg');
    var total=dose+bAmt+cAmt;
    s+=parts.join(' \u00b7 ')+' \u00b7 total oil ent. '+fmtNum(total,1)+' mg</span>';
    out.innerHTML=s;
  })();
}

function openCalcPage(){

  ov.innerHTML=calcPageHtml();
  ov.className="";
  window._calcDir="w2d"; window._calcPw=3.5;

  // wire all inputs/selects to recalc
  Array.prototype.forEach.call(ov.querySelectorAll("input,select"), function(el){
    el.addEventListener("input", calcRecalc);
    el.addEventListener("change", calcRecalc);
  });

    seg.onclick=function(){

      if(window._calcDir==="w2d"){ lbl.textContent="Per injection"; fl.textContent="Weekly total"; }

    ? '<div class="descText">'+escGloss(full)+'</div>'

      '<div class="doseRow'+(hold?' hold':'')+'">'+

function productRow(it, catName, badge){
  var code=it[0], name=it[1], size=it[2], pb=it[4], shortDesc=it[5], danger=it[6];
  var n = state.qty[code]||0;
  var price = priceOf(it);
  var noPrice = price==null;
  var open = !!state.expanded[code];

  var wrap=document.createElement("div");
  wrap.className="rowWrap"+(n>0?" active":"")+(open?" open":"");
  wrap.dataset.code=code;

  var faved = isFav(code);
  var top='<span class="code">'+esc(code)+'</span>'+
          '<span class="name nameTog">'+esc(name)+' <span class="expandChev">'+(open?"\u25be":"\u25b8")+'</span></span>'+
          '<span class="size">'+esc(size)+'</span>';
  if (badge) top+='<span class="catBadge">'+esc(catName)+'</span>';
  if (danger) top+='<span class="danger">\u26a0</span>';

  var priceLine;
  if (noPrice){ priceLine='<span class="poa">price on request</span>'; }
  else {
    priceLine='<span class="usd">$'+price+'</span>';
    if (!isBase()) priceLine+='<span class="cadSmall">\u2248 '+fmtCur(price)+'</span>';
    if (pb!=null && pb!==price) priceLine+='<span class="bulkNote">10+: $'+pb+'</span>';
  }

  var shortHtml = shortDesc ? '<div class="desc'+(danger?' dngr':'')+'">'+esc(shortDesc)+'</div>' : '';

  var starBtn='<button class="favStar'+(faved?' on':'')+'" title="'+(faved?'Remove from favorites':'Save to favorites')+'" aria-label="'+(faved?'Remove from favorites':'Save to favorites')+'">'+(faved?"\u2605":"\u2606")+'</button>';

  var rowHtml =
    '<div class="row">'+
      '<div class="rowMain"><div class="rowTop">'+top+'</div>'+shortHtml+
        '<div class="priceLine">'+priceLine+'</div></div>'+
      starBtn+
      '<div class="stepper">'+
        '<button class="stepBtn minus"'+((n<=0||noPrice)?' disabled':'')+'>\u2212</button>'+
        '<input class="qtyInput" inputmode="numeric" value="'+n+'"'+(noPrice?' disabled':'')+' />'+
        '<button class="stepBtn plus"'+(noPrice?' disabled':'')+'>+</button>'+
      '</div>'+
    '</div>';

  var panelHtml = open ? descPanelHtml(it) : "";

  wrap.innerHTML = rowHtml + panelHtml;

  wrap.querySelector(".nameTog").onclick=function(){
    state.expanded[code]=!state.expanded[code];
    renderList();
  };
  var star=wrap.querySelector(".favStar");
  if (star){
    star.onclick=function(e){
      e.stopPropagation();
      toggleFav(code);
      if (state.browse==="favorites"){
        renderList();            // in the favorites page, unstarring removes the row
      } else {
        var nowOn=isFav(code);
        star.className="favStar"+(nowOn?" on":"");
        star.innerHTML=nowOn?"\u2605":"\u2606";
        star.title=nowOn?"Remove from favorites":"Save to favorites";
      }
      renderBrowseToggle();      // keep the Favorites count badge current
    };
  }
  wrap.querySelector(".minus").onclick=function(){ setQty(code, n-1); };
  wrap.querySelector(".plus").onclick=function(){ setQty(code, n+1); };
  var qi=wrap.querySelector(".qtyInput");
  qi.oninput=function(){
    var v=parseInt(qi.value.replace(/\D/g,""),10); if (isNaN(v)) v=0;
    state.qty[code]=v<0?0:v;
    saveState();
    wrap.className="rowWrap"+(state.qty[code]>0?" active":"")+(state.expanded[code]?" open":"");
    renderBar();
  };
  qi.onblur=function(){ renderList(); };
  return wrap;
}

  var body = note
    ? '<div class="rawNote">'+esc(note)+'</div>'
    : '<div class="rawTiers"><span><b>100g</b> '+t(g100)+tc(g100)+'</span><span><b>500g</b> '+t(g500)+tc(g500)+'</span><span><b>1kg</b> '+t(kg)+tc(kg)+'</span></div>';
  div.innerHTML='<div class="rowTop"><span class="code">'+esc(code)+'</span><span class="name">'+esc(name)+'</span></div>'+body;
  return div;
}

function setQty(code, n){ state.qty[code]=Math.max(0,n); saveState(); renderList(); renderBar(); }

function buildManifest(L, useBulk){
  if (useBulk==null) useBulk = state.useBulk;
  var d=new Date().toISOString().slice(0,10);
  var sub=L.reduce(function(s,l){return s+l.total;},0);
  var grand=sub+SHIPPING;
  // Grouped by catalog section in the vendor's sheet order, items in the sheet's
  // own row sequence within each — so the manifest lines up with the CSR's price
  // sheet exactly.
  var rows=[];
  groupBySheet(L).forEach(function(g, gi){
    if (gi>0) rows.push("");                       // blank line between sections
    rows.push("[ "+g.purpose.toUpperCase()+" ]");
    g.lines.forEach(function(l){
      var nm=(l.it[1]+" "+l.it[2]).trim();
      rows.push(pad(l.code,7)+" x"+pad(String(l.n),3)+" "+nm+"  = $"+l.total+" USD");
    });
  });
  var tail=["--------------------------------------",
      "Subtotal:  $"+sub+" USD",
      "Shipping:  $"+SHIPPING+" USD",
      "TOTAL:     $"+grand+" USD"];
  var b=btcOf(grand);
  if(b!=null){
    var btcLbl = state.btcSrc==="live" ? "live" : "approx";
    tail.push("TOTAL BTC:  \u20bf"+b.toFixed(8)+" ("+btcLbl+" @ $"+Math.round(state.btcRate).toLocaleString()+"/BTC)");
  }
  return ["WWB ORDER \u2014 "+d,
    useBulk?"(10+ tier pricing)":"(single-unit pricing)",
    "--------------------------------------"]
    .concat(rows)
    .concat(tail).join("\n");
}

// ---- saved / preplanned orders ----
// A saved order is a frozen snapshot of a qty map + the bulk tier it was priced
// at. It lives independently of the live cart, so you can stash several and pull
// any one up to copy without disturbing what you're currently working on.
function saveCurrentOrder(name){
  var L=lines();
  if (!L.length) return;
  var snap={};
  for (var code in state.qty){ if (state.qty[code]>0) snap[code]=state.qty[code]; }
  var id="o"+Date.now()+Math.floor(Math.random()*1000);
  state.saved.push({
    id: id,
    name: (name||"").trim() || defaultOrderName(),
    qty: snap,
    useBulk: !!state.useBulk,
    ts: Date.now()
  });
  saveState();
  return id;
}
function defaultOrderName(){
  return "Order "+(state.saved.length+1);
}
function savedOrderManifest(o){
  return buildManifest(linesFrom(o.qty, o.useBulk), o.useBulk);
}
function savedOrderTotal(o){
  var L=linesFrom(o.qty, o.useBulk);
  var sub=L.reduce(function(s,l){return s+l.total;},0);
  return L.length ? sub+SHIPPING : 0;
}
function savedOrderCount(o){
  var L=linesFrom(o.qty, o.useBulk);
  return L.reduce(function(s,l){return s+l.n;},0);
}
function loadSavedOrder(id){
  var o=findSaved(id); if(!o) return;
  // Replace the live cart with this saved order's contents, and remember which
  // saved order we're now editing so "Update" can write changes back to it.
  state.qty={};
  for (var code in o.qty){ if (o.qty[code]>0) state.qty[code]=o.qty[code]; }
  state.useBulk=!!o.useBulk;
  state.editingId=id;
  var bulkBox=document.getElementById("bulk"); if (bulkBox) bulkBox.checked=state.useBulk;
  saveState();
  renderList(); renderBar(); renderSheet();
}
// Write the current cart back onto the saved order the cart is bound to.
function updateSavedOrder(){
  var o=findSaved(state.editingId); if(!o) return;
  var L=lines();
  if (!L.length) return;   // don't overwrite a saved order with an empty cart
  var snap={};
  for (var code in state.qty){ if (state.qty[code]>0) snap[code]=state.qty[code]; }
  o.qty=snap;
  o.useBulk=!!state.useBulk;
  o.ts=Date.now();
  saveState();
  renderList(); renderBar(); renderSheet();
}
// Empty the live cart and drop any binding to a saved order.
function clearCart(){
  state.qty={};
  state.editingId=null;
  saveState();
  renderList(); renderBar(); renderSheet();
}
function deleteSavedOrder(id){
  state.saved=state.saved.filter(function(o){ return o.id!==id; });
  if (state.editingId===id) state.editingId=null;   // binding is gone with the order
  saveState(); renderSheet();
}
function findSaved(id){
  for (var i=0;i<state.saved.length;i++){ if (state.saved[i].id===id) return state.saved[i]; }
  return null;
}
function pad(s,n){ s=String(s); while(s.length<n) s+=" "; return s; }

function renderBar(){
  var L=lines();
  var count=L.reduce(function(s,l){return s+l.n;},0);
  var sub=L.reduce(function(s,l){return s+l.total;},0);
  var grand=L.length?sub+SHIPPING:0;
  var bar=document.getElementById("bar");
  bar.innerHTML=
    '<button class="barMain" id="barBtn">'+
      '<div class="barLeft"><span class="barCount">'+count+'</span>'+
      '<span class="barLabel">'+(count===1?"item":"items")+' \u00b7 incl. $50 ship</span></div>'+
      '<div class="barRight"><div class="barUsd">$'+grand+' <span class="barCur">USD</span></div>'+
      (isBase()?'':'<div class="barCad">\u2248 '+fmtCur(grand)+'</div>')+
      (grand&&state.btcRate?'<div class="barCad" style="color:#f0a848">\u2248 '+fmtBtc(grand)+'</div>':'')+'</div>'+
      '<span class="chev">'+(state.manifestOpen?"\u25be":"\u25b4")+'</span>'+
    '</button>';
  document.getElementById("barBtn").onclick=function(){ state.manifestOpen=!state.manifestOpen; renderSheet(); renderBar(); };
}

function renderSheet(){
  var sheet=document.getElementById("sheet");
  if (!state.manifestOpen){ sheet.className="hidden"; sheet.innerHTML=""; return; }
  sheet.className="";
  var L=lines();
  var head='<div class="sheetHead"><span class="sheetTitle">Order manifest</span>'+
           '<button class="sheetClose" id="sheetClose">\u2715</button></div>';

  // Section that only appears once you actually have saved orders parked.
  var savedHtml = renderSavedSection();

  if (!L.length){
    // Nothing left in the cart — no order to update or clear, so drop any
    // binding rather than carry a stale "Editing X" into the next build.
    if (state.editingId){ state.editingId=null; saveState(); }
    sheet.innerHTML=head+
      '<div class="sheetEmpty">Add quantities and your order slip builds here.</div>'+
      savedHtml;
    document.getElementById("sheetClose").onclick=closeSheet;
    wireSavedButtons();
    return;
  }
  var sub=L.reduce(function(s,l){return s+l.total;},0), grand=sub+SHIPPING;
  var man=buildManifest(L);

  // Editable line list — grouped by primary purpose (a header per group), items
  // alphabetical by name within each group. Same ordering as the manifest below.
  function cartLineHtml(l){
    var nm=esc((l.it[1]).trim());
    // Line total shows the selected display currency; the per-item "$ ea"
    // already conveys USD, so no need to repeat a USD total. On USD base,
    // just show the USD total.
    var totHtml = isBase()
      ? '<span class="clTot">$'+l.total+' USD</span>'
      : '<span class="clTot">'+esc(fmtCur(l.total))+'</span>';
    var open = !!state.expanded[l.code];
    var panel = open ? descPanelHtml(l.it) : "";
    return '<div class="cartLineWrap'+(open?' open':'')+'" data-code="'+esc(l.code)+'">'+
      '<div class="cartLine">'+
        '<div class="clMain">'+
          '<div class="clTop"><span class="clCode">'+esc(l.code)+'</span>'+
            '<span class="clName clNameTog">'+nm+' <span class="expandChev">'+(open?"\u25be":"\u25b8")+'</span></span>'+
            '<span class="clSize">'+esc(l.it[2])+'</span></div>'+
          '<div class="clPrice">$'+l.price+' ea \u00b7 '+totHtml+'</div>'+
        '</div>'+
        '<div class="clStep">'+
          '<button class="stepBtn clMinus">\u2212</button>'+
          '<input class="qtyInput clQty" inputmode="numeric" value="'+l.n+'" />'+
          '<button class="stepBtn clPlus">+</button>'+
        '</div>'+
        '<button class="clRemove" title="Remove from order">\u2715</button>'+
      '</div>'+
      panel+
    '</div>';
  }
  var editable=groupBySheet(L).map(function(g){
    return '<div class="groupHd">'+esc(g.purpose)+'</div>'+
           g.lines.map(cartLineHtml).join("");
  }).join("");

  sheet.innerHTML=head+
    '<div class="cartLines">'+editable+'</div>'+
    '<pre id="manifest">'+esc(man)+'</pre>'+
    '<div class="sheetTotals">'+
      '<div><span class="tLabel">CSR sees</span><span class="tBig">$'+grand+' USD</span></div>'+
      (isBase()
        ? '<div style="text-align:right"><span class="tLabel">Live BTC</span>'+
          '<span class="tBig" style="color:#f0a848">'+(state.btcRate?fmtBtc(grand):"\u2026")+'</span></div>'
        : '<div style="text-align:right"><span class="tLabel">Your cost @ '+state.rate.toFixed(4)+'</span>'+
          '<span class="tBig" style="color:#5ec8e5">'+fmtCur(grand)+'</span></div>')+
    '</div>'+
    (isBase()?'':'<div class="sheetTotals" style="margin-top:0"><div></div>'+
      '<div style="text-align:right"><span class="tLabel">Live BTC</span>'+
      '<span class="tBig" style="color:#f0a848;font-size:16px">'+(state.btcRate?fmtBtc(grand):"\u2026")+'</span></div></div>')+
    '<button class="copyBtn" id="copyBtn">\u2398 Copy USD order for CSR</button>'+
    buildSaveArea()+
    '<div class="disclaimer">Copy block is USD only (what your CSR expects). Bulk \u201c10+\u201d tiers may apply per whole-order, not per line \u2014 confirm final pricing with the CSR.</div>'+
    savedHtml;

  document.getElementById("sheetClose").onclick=closeSheet;
  document.getElementById("copyBtn").onclick=function(){ copyText(man, this); };
  wireSaveArea();

  // Wire the editable line steppers + expand toggle.
  Array.prototype.forEach.call(sheet.querySelectorAll(".cartLineWrap"), function(row){
    var code=row.dataset.code, cur=state.qty[code]||0;
    row.querySelector(".clMinus").onclick=function(){ setQtyFromSheet(code, cur-1); };
    row.querySelector(".clPlus").onclick=function(){ setQtyFromSheet(code, cur+1); };
    row.querySelector(".clRemove").onclick=function(){ setQtyFromSheet(code, 0); };
    // Tap the name to expand the full description (shares state with the list).
    row.querySelector(".clNameTog").onclick=function(){
      state.expanded[code]=!state.expanded[code];
      renderList(); renderSheet();
    };
    var qi=row.querySelector(".clQty");
    qi.onblur=function(){
      var v=parseInt(qi.value.replace(/\D/g,""),10); if (isNaN(v)||v<0) v=0;
      setQtyFromSheet(code, v);
    };
    qi.onkeydown=function(e){ if(e.key==="Enter") qi.blur(); };
  });

  wireSavedButtons();
}

// Adjusting quantity from inside the sheet updates the cart AND rebuilds the
// sheet (so the manifest/totals track), plus the product rows underneath.
function setQtyFromSheet(code, n){
  state.qty[code]=Math.max(0,n);
  saveState();
  renderList(); renderBar(); renderSheet();
}

// The save area changes shape depending on whether the cart is bound to a saved
// order (loaded from one) or free-standing. Bound: banner + Update + Save-as-new.
// Free: name field + Save order. Both always offer Clear cart (when non-empty).
function buildSaveArea(){
  var hasItems = lines().length>0;
  var bound = state.editingId ? findSaved(state.editingId) : null;
  var html="";
  if (bound){
    html+='<div class="editBanner"><span class="editDot">\u25c9</span>Editing saved order: <b>'+esc(bound.name)+'</b></div>'+
      '<div class="btnRow">'+
        '<button class="updateBtn" id="updateBtn">\u21ba Update \u201c'+esc(bound.name)+'\u201d</button>'+
        '<button class="saveNewBtn" id="saveNewBtn">\u2b50 Save as new</button>'+
      '</div>';
  } else {
    html+='<div class="saveRow">'+
      '<input class="saveName" id="saveName" placeholder="Name this order (optional)\u2026" />'+
      '<button class="saveBtn" id="saveBtn">\u2b50 Save order</button>'+
    '</div>';
  }
  if (hasItems){
    html+='<div class="clearRow"><button class="clearBtnSheet" id="clearCartBtn">\u2715 Clear cart</button></div>';
  }
  return html;
}

function wireSaveArea(){
  var upd=document.getElementById("updateBtn");
  if (upd) upd.onclick=function(){ updateSavedOrder(); flashBtn(this, "\u2713 Updated"); };

  var saveNew=document.getElementById("saveNewBtn");
  if (saveNew) saveNew.onclick=function(){ startSaveAsNew(); };

  var saveBtn=document.getElementById("saveBtn");
  if (saveBtn) saveBtn.onclick=function(){
    var nm=document.getElementById("saveName").value;
    saveCurrentOrder(nm);
    // Fresh save-as-new leaves the cart empty and unbound, ready for the next order.
    state.qty={}; state.editingId=null;
    saveState();
    renderList(); renderBar(); renderSheet();
  };

  var clr=document.getElementById("clearCartBtn");
  if (clr) clr.onclick=function(){
    // Two-tap confirm inline so a mistap can't nuke a cart you spent time on.
    if (this.dataset.armed==="1"){ clearCart(); return; }
    this.dataset.armed="1";
    this.textContent="\u2715 Tap again to clear";
    var self=this;
    setTimeout(function(){ if(self && self.dataset){ self.dataset.armed="0"; self.textContent="\u2715 Clear cart"; } }, 2500);
  };
}

// "Save as new" while bound: drop the binding and re-render so the name field
// appears, letting you name this as a brand-new order without touching the one
// you loaded from.
function startSaveAsNew(){
  state.editingId=null;
  saveState();
  renderSheet();
}

function flashBtn(btn, msg){
  var orig=btn.innerHTML;
  btn.textContent=msg;
  setTimeout(function(){ btn.innerHTML=orig; }, 1400);
}

function renderSavedSection(){
  if (!state.saved.length) return "";
  var cards=state.saved.slice().reverse().map(function(o){
    var cnt=savedOrderCount(o), tot=savedOrderTotal(o);
    var L=linesFrom(o.qty, o.useBulk);
    var itemLines=L.slice().sort(function(a,b){
        return CATS.indexOf(a.cat)-CATS.indexOf(b.cat) || (CAT_POS[a.code]||0)-(CAT_POS[b.code]||0);
      })
      .map(function(l){ return "x"+l.n+"  "+l.code+"  "+(l.it[1]).trim(); }).join("\n");
    // Lead with the selected display currency; show USD as the secondary
    // reference (USD is what the CSR sees, so it stays visible either way).
    var totHtml = isBase()
      ? '$'+tot+' USD'
      : fmtCur(tot)+' <span style="color:#5b7186">\u00b7 $'+tot+' USD</span>';
    return '<div class="savedCard" data-id="'+esc(o.id)+'">'+
      '<div class="savedCardHd">'+
        '<span class="savedTitle">'+esc(o.name)+'</span>'+
        '<span class="savedMeta">'+cnt+(cnt===1?" item":" items")+(o.useBulk?" \u00b7 10+":"")+'</span>'+
      '</div>'+
      '<div class="savedItems">'+esc(itemLines)+'</div>'+
      '<div class="savedTot">'+totHtml+'</div>'+
      '<div class="savedBtns">'+
        '<button class="sbCopy" data-id="'+esc(o.id)+'">\u2398 Copy info for CSR</button>'+
        '<button class="sbLoad" data-id="'+esc(o.id)+'">Load into cart</button>'+
        '<button class="sbDel" data-id="'+esc(o.id)+'">Delete</button>'+
      '</div>'+
    '</div>';
  }).join("");
  return '<div class="savedWrap"><div class="savedHd">Saved orders</div>'+cards+'</div>';
}

function wireSavedButtons(){
  var sheet=document.getElementById("sheet");
  Array.prototype.forEach.call(sheet.querySelectorAll(".sbCopy"), function(b){
    b.onclick=function(){
      var o=findSaved(b.dataset.id); if(!o) return;
      copySavedText(savedOrderManifest(o), b);
    };
  });
  Array.prototype.forEach.call(sheet.querySelectorAll(".sbLoad"), function(b){
    b.onclick=function(){ loadSavedOrder(b.dataset.id); };
  });
  Array.prototype.forEach.call(sheet.querySelectorAll(".sbDel"), function(b){
    b.onclick=function(){ deleteSavedOrder(b.dataset.id); };
  });
}

// Copy helper for saved-order buttons (different label restore than the main btn).
function copySavedText(text, btn){
  var orig=btn.innerHTML;
  function ok(){ btn.textContent="\u2713 Copied \u2014 paste to CSR"; setTimeout(function(){ btn.innerHTML=orig; },1600); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else fallbackCopy(text, ok);
}
function closeSheet(){ state.manifestOpen=false; renderSheet(); renderBar(); }

function copyText(text, btn){
  function ok(){ btn.textContent="\u2713 Copied \u2014 paste to CSR"; setTimeout(function(){ btn.innerHTML="\u2398 Copy USD order for CSR"; },1600); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else fallbackCopy(text, ok);
}
function fallbackCopy(text, ok){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){}
  document.body.removeChild(ta);
}

// ---- rate handling ----
// Live FX rates cached USD-based, so currency switches are instant with no refetch.
var fxCache = {};          // { CAD: 1.39, EUR: 0.92, ... }  (USD -> code)
var fxCacheSrc = "fallback";

function rerender(){ setRateDisplay(); renderList(); renderBar(); if(state.manifestOpen) renderSheet(); }

function setRateDisplay(){
  document.getElementById("rateVal").textContent=state.rate.toFixed(4);
  var s=document.getElementById("rateSrc");
  var t = state.rateSrc==="live" ? "live"
        : state.rateSrc==="loading" ? "\u2026"
        : state.rateSrc==="base" ? "base"
        : state.rateSrc==="manual" ? "set"
        : "est";
  s.textContent=t;
  s.style.color = state.rateSrc==="live" ? "#4ac07a" : (state.rateSrc==="base" ? "#8a97a5" : "#e0a55a");
  // Tint the whole chip amber whenever the shown rate is NOT a live, current fetch.
  // live = freshly fetched; base = USD (no conversion, always exact). Everything
  // else (loading, est/fallback, manually set) is flagged so a non-live number
  // can't be misread as current.
  var chip=document.getElementById("rateChip");
  if (chip){
    var trustworthy = (state.rateSrc==="live" || state.rateSrc==="base");
    chip.className = "rateChip" + (trustworthy ? "" : " stale");
    chip.title = state.rateSrc==="live" ? "Live rate, just fetched"
      : state.rateSrc==="base" ? "USD base \u2014 no conversion"
      : state.rateSrc==="loading" ? "Fetching live rate\u2026"
      : state.rateSrc==="manual" ? "Rate set manually \u2014 not live"
      : "Approximate fallback rate \u2014 live fetch unavailable";
  }
}

// Set the active display currency from cache (or fallback) without refetching.
function applyCurrency(code){
  state.cur=code;
  saveState();
  var d=curDef(code);
  if(d.base){ state.rate=1; state.rateSrc="base"; }
  else if(fxCache[code]!=null){ state.rate=fxCache[code]; state.rateSrc=fxCacheSrc==="live"?"live":"fallback"; }
  else { state.rate=d.fb; state.rateSrc="fallback"; }
  rerender();
}

function fetchRate(){
  if(!curDef(state.cur).base){ state.rateSrc="loading"; setRateDisplay(); }
  fetchFX(); fetchBTC();
}

// --- Fiat FX (Frankfurter primary, open.er-api fallback) ---
// No 'to=' filter: we take whatever the API lists, so the dropdown = live-available currencies.
function fetchFX(){
  fetch("https://api.frankfurter.app/latest?from=USD")
    .then(function(r){return r.json();})
    .then(function(j){ if(j&&j.rates&&j.rates.CAD){ cacheFX(j.rates,"live"); } else throw 0; })
    .catch(function(){
      fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json();})
        .then(function(j){ if(j&&j.rates&&j.rates.CAD){ cacheFX(j.rates,"live"); } else throw 0; })
        .catch(function(){ fxCacheSrc="fallback"; if(!curDef(state.cur).base){ state.rateSrc="fallback"; } rerender(); });
    });
}
function cacheFX(rates, src){
  // cache only the rates for currencies in our fixed allow-list; ignore the rest
  CUR_ALLOWED.forEach(function(c){ if(c!=="USD" && rates[c]!=null) fxCache[c]=rates[c]; });
  fxCacheSrc=src;
  // (list is fixed, no rebuild needed)
  // refresh the currently-selected currency's rate if it isn't a manual override
  if(state.rateSrc!=="manual" && !curDef(state.cur).base && fxCache[state.cur]!=null){
    state.rate=fxCache[state.cur]; state.rateSrc="live";
  }
  rerender();
}

// --- Live BTC price (USD per 1 BTC): Coinbase primary, Coingecko fallback ---
function fetchBTC(){
  state.btcSrc="loading";
  fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot")
    .then(function(r){return r.json();})
    .then(function(j){ var p=j&&j.data&&parseFloat(j.data.amount); if(p>0){ state.btcRate=p; state.btcSrc="live"; rerender(); } else throw 0; })
    .catch(function(){
      fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
        .then(function(r){return r.json();})
        .then(function(j){ var p=j&&j.bitcoin&&j.bitcoin.usd; if(p>0){ state.btcRate=p; state.btcSrc="live"; rerender(); } else throw 0; })
        .catch(function(){ state.btcSrc="fail"; rerender(); });
    });
}

function populateCurSelect(){
  var sel=document.getElementById("curSel");
  if(!sel) return;
  var cur=state.cur;
  sel.innerHTML=CURRENCIES.map(function(c){
    var label = c.sym ? (c.code+" "+c.sym) : c.code;
    return '<option value="'+c.code+'">'+label+'</option>';
  }).join("");
  // keep current selection if it still exists, else fall back to USD
  sel.value = curDef(cur).code===cur ? cur : "USD";
  if(sel.value!==cur) state.cur=sel.value;
}

function initRateChip(){
  var sel=document.getElementById("curSel");
  populateCurSelect();
  sel.onchange=function(){ applyCurrency(sel.value); };

  var val=document.getElementById("rateVal"), inp=document.getElementById("rateInput"), ref=document.getElementById("rateRefresh");
  val.onclick=function(){
    if(curDef(state.cur).base) return;   // USD base isn't editable
    val.classList.add("hidden"); inp.classList.remove("hidden"); inp.value=state.rate.toFixed(4); inp.focus(); inp.select();
  };
  function commit(){
    var v=parseFloat(inp.value);
    if(!isNaN(v)&&v>0){ state.rate=v; state.rateSrc="manual"; }
    inp.classList.add("hidden"); val.classList.remove("hidden"); rerender();
  }
  inp.onblur=commit;
  inp.onkeydown=function(e){ if(e.key==="Enter") inp.blur(); };
  ref.onclick=fetchRate;
}

// ---- theme ----
// Dark is the default palette (plain CSS). Light mode is a data-theme override
// on <html>; we also swap the button glyph (moon in dark = "go light",
// sun in light = "go dark") and persist the choice with the rest of state.
function applyTheme(){
  var light = state.theme==="light";
  document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
  var b=document.getElementById("themeBtn");
  if(b){
    b.innerHTML = light ? "\u2600" : "\u263D";   // ☀ when light, ☽ when dark
    b.title = light ? "Switch to dark theme" : "Switch to light theme";
  }
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", light ? "#eef1f4" : "#0a0e13");
}
function toggleTheme(){
  state.theme = state.theme==="light" ? "dark" : "light";
  saveState();
  applyTheme();
}
function initTheme(){
  applyTheme();
  var b=document.getElementById("themeBtn");
  if(b) b.onclick=toggleTheme;
}

// ---- search / bulk ----
function initControls(){
  var s=document.getElementById("search"), clr=document.getElementById("clearBtn"), bulk=document.getElementById("bulk");
  bulk.checked = !!state.useBulk;   // reflect persisted preference
  s.oninput=function(){ state.q=s.value; clr.classList.toggle("hidden", !s.value); renderList(); };
  clr.onclick=function(){ s.value=""; state.q=""; clr.classList.add("hidden"); renderList(); s.focus(); };
  bulk.onchange=function(){ state.useBulk=bulk.checked; saveState(); renderList(); renderBar(); if(state.manifestOpen) renderSheet(); };
}

// ---- glossary wiring ----
function initGlossary(){
  var b=document.getElementById("glossBtn");
  if(b) b.onclick=openGlossaryPage;
  var cb=document.getElementById("calcBtn");
  if(cb) cb.onclick=openCalcPage;
  // delegate: any tap on a .glossLink anywhere opens its popup
  document.addEventListener("click", function(e){
    var t=e.target;
    // walk up a step in case the tap lands on a child
    while (t && t!==document.body){
      if (t.classList && t.classList.contains("glossLink")){
        openGlossPopup(t.getAttribute("data-gk"));
        e.stopPropagation();
        return;
      }
      t=t.parentNode;
    }
  }, true);
  // Esc closes popup then page
  document.addEventListener("keydown", function(e){
    if (e.key==="Escape"){
      var pop=document.getElementById("glossPop");
      if (pop && pop.className!=="hidden"){ closeGlossPopup(); return; }
      var pg=document.getElementById("glossPage");
      if (pg && pg.className!=="hidden"){ pg.className="hidden"; pg.innerHTML=""; return; }
      var cp=document.getElementById("calcPage");
      if (cp && cp.className!=="hidden"){ cp.className="hidden"; cp.innerHTML=""; }
    }
  });
}

// ---- boot ----
loadState();   // restore favorites, cart, and prefs from a previous session
renderBrowseToggle(); renderTabs(); renderCatNote(); renderList(); renderBar();
initRateChip(); initControls(); initTheme(); initGlossary(); applyCurrency(state.cur); fetchRate();
</script>
