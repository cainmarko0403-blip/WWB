<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0e13" />
<title>WWB Order Builder</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; max-width: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0a0e13; color: #dbe4ec;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: hidden;
  }
  #wrap { max-width: 720px; margin: 0 auto; position: relative; min-height: 100vh; overflow-x: hidden; }
  input:focus, button:focus-visible { outline: 2px solid #2f6d86; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #223040; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    padding:16px 16px 12px; border-bottom:1px solid #17212c; }
  .brandRow { display:flex; align-items:center; gap:8px; }
  .brandMark { color:#5ec8e5; font-size:18px; }
  .brand { font-family:ui-monospace,monospace; font-weight:700; letter-spacing:.08em; font-size:15px; color:#eaf2f8; }
  .sub { font-size:11.5px; color:#6b7d8d; margin-top:4px; font-family:ui-monospace,monospace; }

  .rateChip { display:flex; align-items:center; gap:6px; background:#0f161d; border:1px solid #1d2a36;
    border-radius:8px; padding:6px 8px; flex-shrink:0; transition:background .15s, border-color .15s; }
  .rateChip.stale { background:#241b0e; border-color:#7a5a1e; }
  .rateChip.stale .rateVal { border-bottom-color:#a07a2e; }
  .rateLbl { font-size:9.5px; color:#6b7d8d; font-family:ui-monospace,monospace; letter-spacing:.05em; }
  .rateVal { font-family:ui-monospace,monospace; font-size:13px; color:#eaf2f8; background:none; border:none;
    border-bottom:1px dashed #35505f; cursor:pointer; padding:0 1px; }
  #rateInput { width:64px; font-family:ui-monospace,monospace; font-size:13px; background:#0a0e13;
    border:1px solid #2f6d86; border-radius:4px; color:#eaf2f8; padding:1px 4px; }
  .rateSrc { font-size:9px; font-family:ui-monospace,monospace; text-transform:uppercase; letter-spacing:.06em; }
  .curSel { font-family:ui-monospace,monospace; font-size:12px; background:#0a0e13; color:#eaf2f8;
    border:1px solid #2f6d86; border-radius:5px; padding:2px 4px; cursor:pointer; }
  .rateRefresh { background:none; border:none; color:#6b7d8d; cursor:pointer; display:flex; padding:2px; }

  .controls { display:flex; gap:10px; padding:12px 16px 8px; align-items:center; }
  .searchWrap { flex:1; display:flex; align-items:center; gap:8px; background:#0f161d; border:1px solid #1d2a36;
    border-radius:9px; padding:9px 11px; }
  #search { flex:1; background:none; border:none; color:#dbe4ec; font-size:16px; font-family:inherit; min-width:0; }
  .clearBtn { background:none; border:none; color:#5b7186; cursor:pointer; display:flex; padding:0; }
  .bulkToggle { display:flex; align-items:center; gap:6px; font-size:11.5px; color:#8a97a5;
    font-family:ui-monospace,monospace; cursor:pointer; white-space:nowrap; }

  .browseToggle { display:flex; gap:4px; padding:8px 16px 2px; }
  .browseBtn { flex:1; font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.03em;
    padding:8px 10px; border-radius:7px; background:#0b1219; border:1px solid #1d2a36; color:#6b7d8d;
    cursor:pointer; white-space:nowrap; }
  .browseBtn.active { background:#12242e; border:1px solid #2b6070; color:#8fe3fb; }
  .favBtn.active { background:#2a2410; border-color:#7a6320; color:#f0cf6b; }
  .favCount { font-size:9px; font-family:ui-monospace,monospace; background:#3a3114; color:#f0cf6b;
    border-radius:8px; padding:0 5px; margin-left:2px; }
  .favCount:empty { display:none; }
  .favStar { background:none; border:none; cursor:pointer; font-size:17px; line-height:1; padding:4px 2px;
    color:#41505f; flex-shrink:0; align-self:center; -webkit-tap-highlight-color:transparent; }
  .favStar.on { color:#f0cf6b; }
  .favStar:active { transform:scale(1.2); }
  .tabs { display:flex; gap:6px; padding:4px 16px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab { font-family:ui-monospace,monospace; font-size:12px; padding:7px 12px; border-radius:7px; white-space:nowrap;
    background:#0f161d; border:1px solid #1d2a36; color:#8a97a5; cursor:pointer; }
  .tab.active { background:#14313d; border:1px solid #2b6070; color:#8fe3fb; }
  .refTag { font-size:8.5px; background:#22303c; padding:1px 4px; border-radius:3px; margin-left:3px; color:#6b7d8d; }

  .catNote { font-size:11px; color:#6b7d8d; padding:0 16px 10px; font-family:ui-monospace,monospace; line-height:1.5; }

  #list { padding:0 12px 100px; }
  .rowWrap { border-bottom:1px solid #131c25; }
  .rowWrap.active { background:#0d1922; border-radius:8px; border-bottom:1px solid #1a2d38; }
  .rowWrap.open { background:#0c151d; border-radius:8px 8px 0 0; border-bottom:none; }
  .row { display:flex; gap:10px; align-items:center; padding:11px 8px; }
  .rowMain { flex:1; min-width:0; }
  .rowTop { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .code { font-family:ui-monospace,monospace; font-size:12.5px; font-weight:700; color:#5ec8e5; flex-shrink:0; }
  .name { font-size:13.5px; color:#eaf2f8; font-weight:500; }
  .nameTog { cursor:pointer; border-bottom:1px dotted #35505f; }
  .nameTog:active { color:#8fe3fb; }
  .expandChev { color:#5b7186; font-size:10px; }
  .descPanel { padding:2px 10px 14px; }
  .descBox { background:#0b141b; border:1px solid #17212c; border-left:2px solid #2b6070;
    border-radius:0 8px 8px 8px; padding:12px 14px; }
  .descBox.dngr { border-left-color:#e8a13a; }
  .descHd { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .descName { font-family:ui-monospace,monospace; font-size:12px; color:#8fe3fb; font-weight:700; letter-spacing:.02em; }
  .descName.dngr { color:#e8a13a; }
  .descText { font-size:12.5px; color:#c3d0dc; line-height:1.55; }
  .descFoot { margin-top:9px; font-size:10px; color:#5b7186; font-style:italic; font-family:ui-monospace,monospace; }
  .descNone { font-size:12.5px; color:#7b8a98; line-height:1.5; }
  /* ---- expanded profile sections ---- */
  .pfSec { margin-top:11px; }
  .pfSec:first-of-type { margin-top:9px; }
  .pfLbl { font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:#5f93a8; margin-bottom:5px; display:flex; align-items:center; gap:6px; }
  .pfLbl.good { color:#5bb98c; }
  .pfLbl.bad { color:#c98b6b; }
  .pfLbl.pair { color:#a68cc9; }
  .pfLbl.ratio { color:#c9b06b; }
  .pfList { list-style:none; margin:0; padding:0; }
  .pfList li { position:relative; padding:2px 0 2px 15px; font-size:12px; color:#c3d0dc; line-height:1.5; }
  .pfList li:before { content:"\2013"; position:absolute; left:2px; color:#3f5666; }
  .pfList.good li:before { content:"+"; color:#4e9d74; font-weight:700; }
  .pfList.bad li:before { content:"\2022"; color:#b0704e; }
  .pfList.pair li:before { content:"\21c4"; color:#8b6fb0; font-size:10px; top:3px; }
  .pfPairWith { color:#cbb6e8; font-weight:600; }
  .pfRatio { display:flex; gap:14px; flex-wrap:wrap; align-items:baseline; margin-bottom:5px; }
  .pfRatioNum { font-family:ui-monospace,monospace; font-size:15px; color:#f0d98a; font-weight:700; }
  .pfRatioBase { font-size:10.5px; color:#6b7d8d; }
  .pfRatioNote { font-size:11.5px; color:#b3c0cc; line-height:1.5; }
  .pfEff { font-size:12px; color:#c3d0dc; line-height:1.5; }
  .pfClass { display:inline-block; font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.04em;
    background:#12202a; border:1px solid #24414f; color:#8fc9dd; border-radius:4px; padding:2px 7px; margin-top:2px; }
  .pfLbl.chem { color:#b9a3e0; }
  .pfChemText { font-size:12px; color:#c9bce0; line-height:1.5; }
  .pfLbl.run { color:#7fb08a; }
  .pfRun { font-size:12px; color:#c3d0dc; line-height:1.5; }
  .pfLbl.stack { color:#e0b978; }
  .pfStack { font-size:12px; color:#d8cbb3; line-height:1.55; }
  .pfWarnBox { background:#241014; border:1px solid #6e2530; border-left:3px solid #c8434f;
    border-radius:0 8px 8px 0; padding:9px 11px; margin-top:2px; }
  .pfLbl.warn { color:#f0868f; margin-bottom:4px; }
  .pfWarn { font-size:12px; color:#f0cdd0; line-height:1.55; }
  .pfWarn .glossLink { border-bottom-color:#b06a72; }
  .doseRow { margin-top:10px; padding:9px 11px; background:#0a1620; border:1px solid #16303c;
    border-left:2px solid #2b6070; border-radius:0 7px 7px 0; display:flex; flex-direction:column; gap:4px; }
  .doseRow.hold { background:#1a1206; border-color:#4a3410; border-left-color:#e8a13a; }
  .doseLbl { font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#5ec8e5; }
  .doseRow.hold .doseLbl { color:#e8a13a; }
  .doseText { font-size:12.5px; color:#dbe4ec; line-height:1.5; }
  .doseRow.hold .doseText { color:#f0d3a0; }
  .size { font-size:11.5px; color:#7b8a98; font-family:ui-monospace,monospace; }
  .catBadge { font-size:9px; font-family:ui-monospace,monospace; color:#6b7d8d; background:#131c25;
    padding:1px 5px; border-radius:3px; letter-spacing:.03em; }
  .danger { color:#e8a13a; display:inline-flex; align-items:center; font-size:11px; }
  .desc { font-size:11px; color:#6b7d8d; margin-top:3px; line-height:1.4; }
  .desc.dngr { color:#e0a55a; }
  .priceLine { display:flex; align-items:baseline; gap:10px; margin-top:5px; flex-wrap:wrap; }
  .usd { font-family:ui-monospace,monospace; font-size:14px; color:#dbe4ec; font-weight:600; }
  .cadSmall { font-family:ui-monospace,monospace; font-size:11.5px; color:#5b7186; }
  .bulkNote { font-family:ui-monospace,monospace; font-size:10.5px; color:#5f7a52; background:#14200f;
    padding:1px 5px; border-radius:3px; }
  .poa { font-family:ui-monospace,monospace; font-size:11.5px; color:#7b6a52; font-style:italic; }

  .stepper { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .stepBtn { width:32px; height:32px; border-radius:7px; background:#14202a; border:1px solid #22323f;
    color:#a9b8c5; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  .stepBtn:disabled { opacity:.35; cursor:default; }
  .qtyInput { width:40px; height:32px; text-align:center; background:#0a0e13; border:1px solid #1d2a36;
    border-radius:6px; color:#eaf2f8; font-family:ui-monospace,monospace; font-size:15px; }

  .empty { padding:30px; text-align:center; color:#5b7186; font-size:13px; }

  .rawRow { padding:10px 8px; border-bottom:1px solid #131c25; }
  .rawTiers { display:flex; gap:16px; margin-top:5px; font-family:ui-monospace,monospace; font-size:12px;
    color:#b9c6d2; flex-wrap:wrap; }
  .rawCad { color:#5b7186; font-size:10.5px; }
  .rawNote { margin-top:5px; font-family:ui-monospace,monospace; font-size:11.5px; color:#7b6a52; font-style:italic; }

  #bar { position:fixed; bottom:0; left:0; right:0; max-width:720px; margin:0 auto;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,#0a0e13 72%,transparent); z-index:20; }
  .barMain { width:100%; display:flex; align-items:center; gap:12px; cursor:pointer;
    background:#12313d; border:1px solid #2b6070; border-radius:12px; padding:12px 16px; color:#eaf2f8; text-align:left; }
  .barLeft { display:flex; flex-direction:column; flex-shrink:0; }
  .barCount { font-family:ui-monospace,monospace; font-size:20px; font-weight:700; color:#8fe3fb; line-height:1; }
  .barLabel { font-size:10px; color:#7fa9b8; font-family:ui-monospace,monospace; margin-top:2px; }
  .barRight { flex:1; text-align:right; }
  .barUsd { font-family:ui-monospace,monospace; font-size:19px; font-weight:700; line-height:1; }
  .barCur { font-size:11px; color:#7fa9b8; font-weight:400; }
  .barCad { font-family:ui-monospace,monospace; font-size:12px; color:#5ec8e5; margin-top:3px; }
  .chev { flex-shrink:0; color:#8fe3fb; font-size:14px; }

  #sheet { position:fixed; bottom:0; left:0; right:0; max-width:720px; margin:0 auto; background:#0d141b;
    border-top:1px solid #223140; border-radius:16px 16px 0 0; padding:16px;
    padding-bottom:calc(88px + env(safe-area-inset-bottom)); z-index:25; max-height:80vh; overflow-y:auto;
    box-shadow:0 -20px 40px rgba(0,0,0,.5); }
  .sheetHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .sheetTitle { font-family:ui-monospace,monospace; font-size:13px; letter-spacing:.06em; color:#8fe3fb; text-transform:uppercase; }
  .sheetClose { background:#14202a; border:1px solid #22323f; border-radius:7px; color:#a9b8c5; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; }
  .sheetEmpty { padding:20px 8px; color:#5b7186; font-size:13px; text-align:center; }
  #manifest { font-family:ui-monospace,monospace; font-size:11.5px; line-height:1.65; color:#cfe0ec; background:#080c10;
    border:1px solid #17212c; border-radius:10px; padding:14px; overflow-x:auto; white-space:pre; margin:0; }
  .sheetTotals { display:flex; justify-content:space-between; margin:14px 2px 12px; }
  .tLabel { display:block; font-size:9.5px; color:#6b7d8d; font-family:ui-monospace,monospace; text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:3px; }
  .tBig { font-family:ui-monospace,monospace; font-size:20px; font-weight:700; color:#eaf2f8; }
  .copyBtn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:#12313d;
    border:1px solid #2b6070; color:#8fe3fb; font-family:ui-monospace,monospace; font-size:14px; font-weight:600;
    padding:13px; border-radius:11px; cursor:pointer; }
  .disclaimer { font-size:10.5px; color:#5b7186; margin-top:10px; line-height:1.5; font-family:ui-monospace,monospace; }

  /* ---- editable cart lines inside the sheet ---- */
  .cartLines { margin-bottom:12px; }
  .groupHd { font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.07em; text-transform:uppercase;
    color:#5f93a8; margin:14px 2px 4px; display:flex; align-items:center; gap:8px; }
  .groupHd:first-child { margin-top:2px; }
  .groupHd:before, .groupHd:after { content:""; flex:1; height:1px; background:#17212c; }
  .cartLineWrap { border-bottom:1px solid #131c25; }
  .cartLineWrap:last-child { border-bottom:none; }
  .cartLineWrap.open { background:#0a1219; border-radius:8px; }
  .cartLine { display:flex; align-items:center; gap:10px; padding:8px 4px; }
  .clMain { flex:1; min-width:0; }
  .clTop { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .clCode { font-family:ui-monospace,monospace; font-size:12px; font-weight:700; color:#5ec8e5; }
  .clName { font-size:12.5px; color:#eaf2f8; }
  .clNameTog { cursor:pointer; border-bottom:1px dotted #35505f; }
  .clNameTog .expandChev { color:#5ec8e5; font-size:9px; border-bottom:none; }
  .clSize { font-size:10.5px; color:#7b8a98; font-family:ui-monospace,monospace; }
  .clPrice { font-family:ui-monospace,monospace; font-size:11.5px; color:#8a97a5; margin-top:2px; }
  .clTot { color:#dbe4ec; font-weight:600; }
  .clStep { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .clRemove { background:none; border:none; color:#8a5a4a; cursor:pointer; font-size:15px; padding:4px 6px; flex-shrink:0; }
  .clRemove:active { color:#c98b6b; }

  /* ---- save-order + saved-orders section ---- */
  .saveRow { display:flex; gap:8px; margin:4px 0 14px; }
  .saveName { flex:1; min-width:0; background:#0a0e13; border:1px solid #1d2a36; border-radius:8px;
    color:#eaf2f8; font-size:14px; font-family:inherit; padding:10px 11px; }
  .saveBtn { flex-shrink:0; background:#14202a; border:1px solid #2b5061; color:#8fd3e8;
    font-family:ui-monospace,monospace; font-size:12.5px; font-weight:600; padding:0 14px; border-radius:8px; cursor:pointer; }
  .saveBtn:disabled { opacity:.4; cursor:default; }

  /* editing-binding banner + action buttons */
  .editBanner { display:flex; align-items:center; gap:8px; background:#12242e; border:1px solid #2b5061;
    border-radius:8px; padding:9px 12px; margin:4px 0 10px; font-family:ui-monospace,monospace; font-size:12px; color:#8fd3e8; }
  .editBanner b { color:#eaf2f8; font-weight:600; }
  .editBanner .editDot { color:#5ec8e5; font-size:9px; }
  .btnRow { display:flex; gap:8px; margin:4px 0 10px; flex-wrap:wrap; }
  .btnRow button { font-family:ui-monospace,monospace; font-size:12.5px; font-weight:600;
    padding:11px 12px; border-radius:8px; cursor:pointer; }
  .updateBtn { flex:1; min-width:130px; background:#14313d; border:1px solid #2b6070; color:#8fe3fb; }
  .saveNewBtn { flex:1; min-width:130px; background:#14202a; border:1px solid #22323f; color:#a9b8c5; }
  .clearBtnSheet { background:#1c1210; border:1px solid #3a201a; color:#b07a6a;
    font-family:ui-monospace,monospace; font-size:12.5px; padding:11px 14px; border-radius:8px; cursor:pointer; }
  .clearRow { display:flex; justify-content:flex-end; margin:0 0 10px; }

  .savedWrap { margin:6px 0 4px; }
  .savedHd { font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:#7fa9b8; margin:16px 2px 8px; display:flex; align-items:center; gap:7px; }
  .savedHd:before, .savedHd:after { content:""; flex:1; height:1px; background:#17212c; }
  .savedCard { background:#0b141b; border:1px solid #17212c; border-radius:10px; padding:11px 12px; margin-bottom:10px; }
  .savedCardHd { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
  .savedTitle { font-size:13.5px; color:#eaf2f8; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .savedMeta { font-family:ui-monospace,monospace; font-size:10.5px; color:#6b7d8d; flex-shrink:0; }
  .savedItems { font-family:ui-monospace,monospace; font-size:11px; color:#9fb0bd; line-height:1.6; margin:2px 0 9px; white-space:pre-wrap; }
  .savedTot { font-family:ui-monospace,monospace; font-size:12px; color:#8fe3fb; margin-bottom:9px; }
  .savedBtns { display:flex; gap:7px; flex-wrap:wrap; }
  .savedBtns button { font-family:ui-monospace,monospace; font-size:11.5px; padding:8px 11px; border-radius:8px; cursor:pointer; }
  .sbCopy { flex:1; min-width:120px; background:#12313d; border:1px solid #2b6070; color:#8fe3fb; font-weight:600; }
  .sbLoad { background:#14202a; border:1px solid #22323f; color:#a9b8c5; }
  .sbDel { background:#1c1210; border:1px solid #3a201a; color:#b07a6a; }

  /* ---- glossary: inline links, popup, full page ---- */
  .glossLink { border-bottom:1px dotted #6a8fa0; cursor:pointer; color:inherit; }
  .glossLink:active { color:#8fe3fb; border-bottom-color:#8fe3fb; }

  #glossPop { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:20px; background:rgba(4,8,12,.66); backdrop-filter:blur(2px); }
  .glossPop { }
  .glossCard { width:100%; max-width:440px; background:#0d1620; border:1px solid #24414f;
    border-radius:14px; padding:16px 16px 14px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .glossCardHd { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:9px; }
  .glossCardTitle { font-family:ui-monospace,monospace; font-size:14px; font-weight:700; color:#8fe3fb; letter-spacing:.02em; }

var CURRENCIES = buildCurrencyList(CUR_ALLOWED);

function buildCurrencyList(codes){
  // keep only allowed codes, dedupe, USD+CAD first, rest alphabetical
  var seen={}, rest=[];
  codes.forEach(function(c){
    if(seen[c] || !CUR_META[c] || CUR_PINNED.indexOf(c)>=0) return;
    seen[c]=1; rest.push(c);
  });
  rest.sort();
  var ordered=CUR_PINNED.slice().concat(rest);
  return ordered.map(function(c){
    var m=CUR_META[c];
    return { code:c, sym:m.sym, dp:m.dp, fb:m.fb, base:(c==="USD") };
  });
}

// ---- persistence (localStorage; survives between sessions) ----
// Standalone-file build, so localStorage is the right store. We persist the
// favorites list, the cart quantities, and a couple of UI prefs. Wrapped in
// try/catch so a locked-down browser (private mode, etc.) degrades gracefully.
var LS_KEY = "wwb_order_builder_v1";
function saveState(){
  try {
    var payload = { favs: state.favs, qty: state.qty, useBulk: state.useBulk, cur: state.cur, saved: state.saved, theme: state.theme };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
  } catch(e){ /* storage unavailable — app still works, just no persistence */ }
}
function loadState(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    var p = JSON.parse(raw);
    if (p && typeof p==="object"){
      if (p.favs && typeof p.favs==="object") state.favs = p.favs;
      if (p.qty && typeof p.qty==="object") state.qty = p.qty;
      if (typeof p.useBulk==="boolean") state.useBulk = p.useBulk;
      if (typeof p.cur==="string") state.cur = p.cur;
      if (Array.isArray(p.saved)) state.saved = p.saved;
      if (p.theme==="light" || p.theme==="dark") state.theme = p.theme;
    }
  } catch(e){ /* corrupt or unavailable — start fresh */ }
}
function isFav(code){ return !!state.favs[code]; }
function toggleFav(code){
  if (state.favs[code]) delete state.favs[code];
  else state.favs[code] = true;
  saveState();
}
function favCount(){ var n=0; for (var k in state.favs){ if (state.favs[k]) n++; } return n; }

  ["proviron","Proviron (mesterolone): a mild oral DHT-derivative used mostly as an ancillary. It frees up testosterone (by binding SHBG) and adds a mild anti-estrogen/'dryness' effect rather than building mass."],

  ["halotestin","Halotestin (fluoxymesterone): an extremely potent oral androgen used short-term for strength and aggression, and markedly liver-toxic. An advanced, high-caution compound."],

  ["dhb","DHB (1-testosterone / dihydroboldenone): a strong anabolic known for lean gains, but often causes notable injection-site soreness."],

  ["immune enhancement","A proprietary injectable 'immune' blend (glutathione / vitamin-C / zinc family). Marketed for immune support; not a single defined drug."],

  ["17a-methyl-1-test","A methylated oral androgen — potent and hepatotoxic, like other methylated orals."],
  ["exemestane","Exemestane (Aromasin): a steroidal aromatase inhibitor that lowers estrogen by permanently disabling the aromatase enzyme, used to control estrogen from aromatising androgens. Over-suppressing estrogen has its own downsides — joints, lipids, mood and libido."],
  ["aromasin","Exemestane (Aromasin): a steroidal aromatase inhibitor that lowers estrogen by irreversibly disabling aromatase. Crashing estrogen too low causes joint, lipid, mood and libido problems."],
  ["anastrozole","Anastrozole (Arimidex): a reversible aromatase inhibitor for estrogen control — potent and easy to overshoot into 'crashed estrogen' symptoms."],
  ["arimidex","Anastrozole (Arimidex): a reversible aromatase inhibitor for estrogen control; easy to overshoot into low-estrogen symptoms."],
  ["letrozole","Letrozole: a strong aromatase inhibitor, very effective at lowering estrogen and easy to over-suppress — often reserved for higher-estrogen situations."],
  ["tamoxifen","Tamoxifen (Nolvadex): a SERM that blocks estrogen at breast tissue and raises LH/FSH. Used to manage gynecomastia and in post-cycle recovery."],

  ["clomid","Clomid (clomiphene): a SERM that raises LH/FSH to stimulate natural testosterone, common in post-cycle and fertility use. Can cause visual and mood side effects."],

  ["cabergoline","Cabergoline: a dopamine agonist that lowers prolactin, used to manage prolactin-related side effects (e.g. from nandrolone or tren) or high-prolactin conditions. Can affect blood pressure and mood."],

  ["cardarine","Cardarine (GW-501516): a PPAR-delta agonist for endurance and fat oxidation — not a SARM. Development was halted after cancer signals in animal studies at high doses. Caution."],

  ["5-amino-1mq","5-amino-1MQ: an NNMT-enzyme inhibitor researched for metabolism and fat cells; early-stage."],
  ["bam15","BAM15: a mitochondrial uncoupler researched for fat loss — a gentler concept than DNP, but still early and not proven safe in humans."],
  ["nad","NAD+: a coenzyme central to cellular energy and repair, popular in longevity circles. Injectable NAD+ can cause flushing and discomfort if pushed too fast."],
  ["glutathione","Glutathione: the body's main antioxidant tripeptide, used for oxidative stress and, cosmetically, skin brightening."],
  ["methylene blue","Methylene Blue: a redox dye with research interest in mitochondrial and cognitive effects. It interacts dangerously with serotonergic drugs (serotonin-syndrome risk) and stains everything blue. Caution with antidepressants."],

  ["semax","Semax: a Russian nootropic peptide (an ACTH fragment) researched for focus and neuroprotection."],
  ["na selank","NA-Selank amidate: a longer-acting form of Selank, a Russian anxiolytic peptide researched for calm without sedation."],
  ["selank","Selank: a Russian anxiolytic peptide (a tuftsin analog) researched for anxiety and calm without sedation."],
  ["epitalon","Epitalon (epithalon): a pineal peptide (Khavinson) researched for circadian, telomere and longevity effects; evidence is mostly from limited Russian studies."],

  ["vip","VIP (vasoactive intestinal peptide): researched for inflammation and autonomic effects; can lower blood pressure."],
  ["oxytocin","Oxytocin: the 'bonding' hormone, used in research/compounding for social and mood effects; short-acting."],
  ["mt-2","Melanotan II: a melanocortin agonist that darkens skin (tanning) and also affects libido and appetite. Nausea and darkening of moles/freckles are common — watch for skin changes."],

  ["melanotan","Melanotan: a melanocortin agonist that darkens skin (tanning); MT-2 also affects libido and appetite. Nausea and mole/freckle darkening are common."],

  ["cerebrolysin","Cerebrolysin: a mix of neuropeptides used in some countries for stroke and cognitive indications, given as injected courses."],
  ["isotretinoin","Isotretinoin (Accutane): a powerful retinoid for severe acne — highly effective, but strongly harmful in pregnancy, plus dryness and lipid/liver effects, with mood worth monitoring."],
  ["ivermectin","Ivermectin: an antiparasitic drug approved for parasitic infections; other promoted uses lack solid support."],
  ["fenbendazole","Fenbendazole: a veterinary antiparasitic (benzimidazole) that circulates in alternative-cancer discussion without solid human evidence."],
  ["hydroxychloroquine","Hydroxychloroquine: an antimalarial and autoimmune drug that can affect heart rhythm and, long-term, the retina."],

  ["prednisone","Prednisone: a corticosteroid (anti-inflammatory/immunosuppressive). Potent, with wide-ranging effects beyond short courses — blood sugar, bone, mood and adrenal suppression."],

  ["pinealon","Pinealon: a short Khavinson peptide aimed at brain/nervous tissue, researched for cognition and neuroprotection; limited evidence."],
  ["stanozolol","Stanozolol (Winstrol): a DHT-derived anabolic, oral or injectable (the injectable is a water-based suspension, not an oil). Valued for a dry, hard look and strength without water weight, but it has the worst HDL-cholesterol suppression in its class, dries out and aches the joints, and — even in the injectable form — still strains the liver. The water-based shot is notoriously painful."],
  ["winstrol","Stanozolol (Winstrol): a DHT-derived anabolic, oral or injectable (the injectable is a water-based suspension, not an oil). Valued for a dry, hard look and strength without water weight, but it has the worst HDL suppression in its class, dries and aches the joints, and still strains the liver even injected. The water-based shot is notoriously painful."],
  ["stanolone","DHT / androstanolone (stanolone): dihydrotestosterone itself — the pure androgen your body makes from testosterone via 5-alpha-reductase. Strongly androgenic but non-aromatising (it can't convert to estrogen), so no water retention or gyno; the trade-off is a heavy hit to hair loss and prostate if you're predisposed. The medical form is a transdermal gel; any injectable use here is experimental."],
  ["t3","T3 (liothyronine): the active thyroid hormone, used to raise metabolic rate for fat loss. Effective but blunt — it burns muscle alongside fat, suppresses your own thyroid output while you take it, and can strain the heart and cause tremor/palpitations. Must be tapered, never stopped abruptly, and is easy to overshoot."],
  ["t4","T4 (levothyroxine): the storage form of thyroid hormone that the body converts to active T3 as needed. Milder and slower than T3 — roughly six weeks to judge a dose change — and mainly relevant for correcting an actual low-thyroid state rather than for aggressive fat loss. Over-dosing brings the same heart-rate, tremor and bone concerns as excess thyroid hormone."],
  ["ptd-dbm","PTD-DBM: an experimental topical hair-loss compound that blocks a protein (CXXC5) suppressing the Wnt hair-growth pathway, studied to reactivate dormant follicles — often paired with valproic acid or minoxidil. Purely experimental, topical only, with no established human safety data."],
  ["p21-adamantane","P21 (adamantane form): a synthetic peptide modelled on part of the BDNF neurotrophic pathway, researched for neurogenesis, memory and mood. The adamantane modification helps it cross the blood-brain barrier better than plain P21. Early-stage research chemical with little human data."],
  ["p21","P21: a synthetic peptide modelled on part of the BDNF pathway, researched for neurogenesis, memory and mood — a nootropic/neuroprotective candidate. Early-stage with little human data; usually dosed intranasally."],
  ["pe 22-28","PE 22-28: a small peptide derived from spadin, researched as a fast-acting antidepressant candidate (it blocks the TREK-1 channel) and for neuroprotection. Very early-stage; no established human protocol."],
  ["adamax","Adamax: a nootropic research blend of Semax with an adamantane modification, aimed at focus and neuroprotection with better brain penetration. Anecdotal only — no formal human data."],
  ["lipo","Lipo-C / lipotropic injection (MIC — methionine, inositol, choline, usually with B-vitamins and L-carnitine): marketed to 'support fat metabolism.' Realistically the noticeable effect is the B12 and the weekly routine unless you're deficient in the components; it is not a weight-loss drug and the fat-loss evidence is weak. Generally well tolerated."],
  ["l-carnitine","L-carnitine: an amino-acid derivative that shuttles fatty acids into mitochondria to be burned for energy, used for fat metabolism and recovery. Injected forms bypass the poor oral absorption. Benefit is modest at best unless you're genuinely low; generally well tolerated, occasional fishy body odour at higher doses."],
  ["vitamin d","Vitamin D (injectable, high-concentration): the fat-soluble hormone-vitamin for bone, immune and general health. This preparation is very concentrated (20,000 iu/mL), so it's easy to overshoot by a simple arithmetic error — dose to a blood level, not a fixed schedule, since chronic excess causes high calcium (nausea, kidney strain). Correcting a real deficiency is where it earns its place."],
  ["b12","Vitamin B12 (cyanocobalamin/methylcobalamin): a water-soluble vitamin for red-blood-cell formation, nerves and energy metabolism. Very safe — excess is simply excreted — and genuinely useful against a deficiency, but it won't do much for energy or fat loss if your levels are already normal. It's the active ingredient behind most of the 'lipo' shot's felt effect."]

var BLEND_DESC = [
  ["klow","KLOW blend — GHK-Cu + TB-500 + BPC-157 + KPV in one vial. This is the GLOW recovery stack with KPV added: BPC-157 and TB-500 are the tissue-repair pair (gut, tendon, muscle), GHK-Cu drives skin/collagen remodelling and wound healing, and KPV (an alpha-MSH fragment) layers on anti-inflammatory action, especially in the gut. The logic is one shot covering repair, skin and inflammation at once. All four are research peptides with limited human evidence; the copper in GHK-Cu accumulates, so this is meant to be cycled, not run continuously."],
  ["glow","GLOW blend — GHK-Cu + TB-500 + BPC-157 in one vial. The two repair peptides (BPC-157 for gut/tendon, TB-500 for broader tissue and flexibility) are paired with GHK-Cu, a copper tripeptide that handles skin, hair and collagen. Stacked so a single injection targets both deep-tissue recovery and skin/cosmetic renewal. All three are research peptides with limited human data; the copper accumulates, so cycle it rather than running it non-stop."],
  ["bpc157 10 + tb500 10 + kpv","Triple recovery blend — BPC-157 + TB-500 + KPV. BPC-157 (gut/tendon/ligament repair) and TB-500 (a thymosin β4 fragment for broader tissue recovery and flexibility) are the classic healing pair; KPV, a short anti-inflammatory tripeptide, is added to dampen inflammation — useful where gut or joint inflammation is part of the picture. One vial, three angles on recovery. All three are research peptides with limited human evidence."],
  ["bpc157","BPC-157 + TB-500 blend — the two most-used recovery peptides in one vial. BPC-157 is a synthetic gastric peptide studied for gut, tendon and ligament healing; TB-500 is a thymosin β4 fragment studied for broader tissue repair, flexibility and blood-vessel growth. They're paired because their mechanisms complement each other — local repair plus systemic recovery — and users report better results together than either alone. Both are research peptides; human evidence is limited and mostly preclinical."],
  ["bpc 500 + tb500","Oral BPC-157 + TB-500 blend (tablets). Same recovery pairing as the injectable — BPC-157 for gut/tendon repair, TB-500 for broader tissue recovery — but taken orally. Oral peptide absorption is low, so this route is gentler and better suited to gut-focused goals than to systemic tendon/muscle repair, where injection is more effective. Research peptides; limited human data."],
  ["ghk-cu 50 + kpv","GHK-Cu + KPV blend — a skin and anti-inflammatory pairing. GHK-Cu is a copper tripeptide for skin remodelling, collagen and wound healing; KPV is an alpha-MSH fragment with anti-inflammatory action (notably in the gut and skin). Stacked to cover cosmetic renewal and inflammation in one shot. Both are research peptides with limited human evidence; the copper in GHK-Cu accumulates, so cycle rather than run continuously."],
  ["tesamorelin 11 + ipamorelin","Tesamorelin + Ipamorelin blend — a GH-axis combo pairing a GHRH analog with a GHRP. Tesamorelin (a GHRH analog approved to cut visceral belly fat) raises the baseline of the body's own GH release, while ipamorelin (a selective ghrelin-receptor agonist) triggers a clean GH pulse with little effect on cortisol or prolactin. Pairing a GHRH with a GHRP produces a larger, more natural GH pulse than either alone — the standard reason these two classes are stacked. Effects build over months; watch fasting glucose, since sustained GH elevation nudges insulin resistance."],
  ["cagrilintide 5 + semaglutide","CagriSema-style blend — Cagrilintide + Semaglutide. Semaglutide is a GLP-1 agonist (appetite, glucose, gastric emptying); cagrilintide is a long-acting amylin analog that curbs appetite through a separate pathway. The two hormones hit hunger by different mechanisms, so combined they suppress appetite more than either alone — this pairing produced some of the strongest weight-loss numbers in trials. Investigational. GI side effects (nausea, early satiety) are common and stack from both components, so slow titration matters."],
  ["retatrutide 5 + cagrilintide","Retatrutide + Cagrilintide blend. Retatrutide is a triple agonist (GLP-1 + GIP + glucagon) already showing the largest weight-loss effects in its class; cagrilintide is an amylin analog adding a fourth, separate appetite pathway. Stacked to attack appetite and metabolism from every available angle at once. Both are investigational and not approved; GI side effects are typical of the class and compound from both parts — titrate slowly."],
  ["selank 10 + semax","Selank + Semax blend — the two best-known Russian research nootropics paired. Semax (an ACTH fragment) is the stimulating/focus side; Selank (a tuftsin analog) is the calming/anxiolytic side. Combined, the idea is focus without the jittery edge — Selank offsets any over-stimulation from Semax. Both are research peptides, usually dosed intranasally, with evidence largely from limited Russian studies."],
  ["nad+ 100 + mots-c","Metabolic blend — NAD+ + MOTS-c + 5-Amino-1MQ. NAD+ is a coenzyme central to cellular energy and repair; MOTS-c is a mitochondria-derived peptide studied for metabolism and exercise capacity; 5-Amino-1MQ inhibits the NNMT enzyme, studied for fat-cell metabolism. Three different levers on mitochondrial and metabolic function in one vial. All are longevity/metabolic research compounds with limited human data. The smaller NAD+ share here means less of the intense flushing/discomfort that standalone NAD+ injections cause."],
  ["cjc-1295 no dac","CJC-1295 (no DAC) + Ipamorelin blend — the standard GH-axis stack. CJC-1295 without DAC is a short-acting GHRH analog that raises the GH 'ceiling'; ipamorelin is a clean ghrelin-receptor GHRP that fires a GH pulse. Pairing a GHRH with a GHRP gives a bigger, more physiological GH release than either alone, which is exactly why this is the most common secretagogue combo. Dosed on an empty stomach, typically including one dose before bed. Research peptides."],
  ["slu-pp-332 250 + bam15","SLU-PP-332 + BAM15 blend (oral) — an experimental metabolic combo. SLU-PP-332 is an 'exercise-mimetic' (ERR agonist) studied in animals; BAM15 is a mitochondrial uncoupler researched for fat loss (a gentler concept than DNP, but still early). Stacked to push energy expenditure through two mechanisms. Both are very early-stage with no established human dosing — circulating doses are extrapolated from rodent studies, not proven safe in people."],
  ["blend 300","Blend 300 — Tren Acetate + Masteron Propionate + Test Propionate, 100 mg each per mL, all short-ester. A classic cut/recomp oil: testosterone as the base androgen, trenbolone for potent muscle/strength and hardening, masteron (a DHT-derivative) for a dry, hard cosmetic look and mild anti-estrogen effect. All three run on matched fast esters so they clear together. This is an advanced stack — trenbolone alone brings sweats, insomnia, mood volatility, cardiovascular strain and possible prolactin effects; masteron is cosmetic only and accelerates hair loss if predisposed; the test aromatises and suppresses natural production. Not a beginner combination."],
  ["blend 375","Blend 375 — Tren Enanthate + Masteron Enanthate + Test Enanthate, 125 mg each per mL, all long-ester. The same testosterone/trenbolone/masteron cut-and-harden logic as Blend 300, but on long esters for less frequent injection and steadier levels. Test is the base androgen, tren the potent driver (sweats, insomnia, mood/cardiovascular effects, possible prolactin), masteron the DHT-derived 'dry look' component that worsens hair loss if predisposed. Advanced-level stack."],
  ["blend 500","Blend 500 — Tren Enanthate 250 + Masteron Enanthate 250 per mL, long-ester. A high-concentration two-part hardening blend with no testosterone in the vial itself (usually run alongside a separate test base). Trenbolone supplies the potent muscle/strength and its harsh profile (sweats, insomnia, mood, cardiovascular strain, prolactin); masteron adds the dry, hard cosmetic finish and mild anti-estrogen effect, and accelerates hair loss if predisposed. High-volume, advanced compound."],
  ["trenmix","Trenmix — Tren Acetate 75 + Tren Enanthate 125 per mL. A single compound (trenbolone) in two esters: the fast acetate gives a quick onset, the slow enanthate sustains levels, so you get both a rapid start and steady blood levels from one oil. Trenbolone is a very potent non-aromatising androgen with a harsh profile — sweats, insomnia, mood/aggression changes, cardiovascular strain and possible prolactin effects. An advanced compound; not a first addition to a stack."],
  ["tritren","TriTren — Tren Acetate + Tren Enanthate + Tren Hexahydrobenzylcarbonate, 75 mg each per mL. All three are the same drug (trenbolone) on three different esters — fast, medium and slow — layered so onset is quick and levels stay steady across the week from a single injection. Everything about trenbolone's potency and harshness applies in full: sweats, insomnia, mood volatility, cardiovascular strain, possible prolactin effects. Advanced only."],
  ["ripex","Ripex — Tren Acetate + Masteron Propionate + Test Propionate, 75 mg each per mL, all short-ester. Same three-compound cutting logic as Blend 300 at a lower per-mL dose: testosterone base, trenbolone for potent hardening and strength, masteron for the dry cosmetic look and mild anti-estrogen effect. Fast esters clear together. Advanced stack — tren's sweats/insomnia/mood/cardiovascular profile and masteron's hair-loss acceleration both apply, and the test aromatises and suppresses natural production."],
  ["nandromix","Nandromix — NPP 100 + Deca (Nandrolone Decanoate) 200 per mL. One drug (nandrolone) in a fast ester and a slow ester together, so it kicks in quickly and then holds. Nandrolone has a joint/recovery reputation but is strongly suppressive and progestogenic, with known sexual and mood side effects; prolactin management (cabergoline) is usually run alongside, plus hCG to protect the natural axis. Long-run compound — give it 12–16 weeks to show."],
  ["cock bombs","Cock Bombs — a combo ED tablet stacking two PDE5 inhibitors, ~50 mg sildenafil (Viagra) + ~20 mg tadalafil (Cialis). Same blood-flow mechanism from both, so you get sildenafil's fast onset plus tadalafil's long duration in one dose. Because it's two PDE5 inhibitors at once, both drugs' cautions apply and stack: never combine with nitrates, and be careful with anything that lowers blood pressure. Don't add more PDE5 on top."],
  ["ggh","GGH blend — GHK-Cu + Glutathione. GHK-Cu is a copper tripeptide for skin remodelling, collagen and wound healing; glutathione is the body's main antioxidant tripeptide, used for oxidative stress and, cosmetically, skin brightening. Paired for a skin/anti-aging and antioxidant effect in one shot. Both are well-tolerated but evidence for injected cosmetic benefit is limited; GHK-Cu's copper accumulates, so cycle it."],
  ["super human blend","SHB (Super Human Blend) — a proprietary injectable amino-acid + NAC mix marketed for general recovery and 'performance.' It isn't a single defined drug and there's no established dosing; benefit is marginal unless you're actually deficient in one of the components. Treat the marketing claims skeptically."],
  ["hair/skin/nails","HHB (Hair/Skin/Nails Blend) — a proprietary injectable B-vitamin / biotin / folate mix marketed for hair, skin and nail health. Not a defined drug and no established dosing; for most people this duplicates what an oral B-complex would do, and only helps meaningfully against a real deficiency."],
  ["lipo mino","LMX (Lipo Mino Mix) — a proprietary lipotropic injection (MIC: methionine, inositol, choline, plus B-vitamins and usually L-carnitine). Marketed to 'support fat metabolism.' In practice the effect is mostly the B12 and the weekly routine unless you're deficient in the components; it is not a weight-loss drug and the fat-loss evidence is weak."],
  ["fat blaster","Fat Blaster — a proprietary lipotropic 'shred' injection (carnitine + B-vitamins + methionine/inositol/choline, sometimes with added stimulant-style ingredients). Marketed for fat loss, but like all lipotropic blends the felt effect is mostly the B12 and the routine; it is not a weight-loss drug and works only modestly, if at all, absent a real deficiency."],
  ["super shred","Super Shred — a proprietary lipotropic 'shred' injection (L-carnitine, B-vitamins, methionine/inositol/choline). Same category as the other Lipo-C blends: marketed to support fat metabolism, but the evidence is weak and the noticeable part is mostly the B12 unless you're deficient in a component. Not a weight-loss drug."],
  ["shred","Shred — a proprietary lipotropic injection (carnitine, B-vitamins, methionine/inositol/choline). Marketed for fat loss; realistically the effect is mostly the B12 and the weekly ritual unless you're genuinely deficient. Not a weight-loss drug, and the fat-loss evidence is weak."],
  ["lemon bottle","Lemon Bottle — an aesthetic subcutaneous fat-dissolving solution (its marketed actives are riboflavin/B2, lecithin and bromelain) injected directly into small fat pockets by a practitioner over spaced sessions. It works locally by breaking down fat cells in the treated area, not systemically. Unproven and unregulated as sold; expect swelling, bruising and soreness at the site, and there's no established self-injection protocol — this is a clinic procedure."],
  ["immune enhancement","GAZ (Immune Enhancement) — a proprietary injectable glutathione / vitamin-C / zinc blend marketed for immune support. Not a single defined drug and no established dosing. Glutathione and vitamin C are antioxidants and zinc supports immune function, but injected 'immune boosting' benefit in a healthy person is largely unproven."],
  ["relaxation","RP226 (Relaxation PM) — a proprietary injectable GABA / melatonin / arginine blend marketed as a sleep/calm aid before bed. Not a defined drug and no established dosing. Melatonin can aid sleep onset, but injected GABA doesn't cross into the brain well, so the calming claim is questionable; effect is likely mild."],
  ["gaba","SZ352 — a proprietary injectable GABA / L-theanine / taurine / melatonin blend marketed for relaxation and sleep. Not a defined drug and no established dosing. As with other injectable GABA products, GABA itself doesn't readily cross the blood-brain barrier, so any calming effect is more likely from the melatonin/theanine; expect a mild effect at best."]
];

function descFor(it){
  var name = (it[1] || "").toLowerCase();
  for (var i=0;i<BLEND_DESC.length;i++){ if (name.indexOf(BLEND_DESC[i][0])>=0) return BLEND_DESC[i][1]; }
  for (var i=0;i<DESC_KW.length;i++){ if (name.indexOf(DESC_KW[i][0])>=0) return DESC_KW[i][1]; }
  return null;
}

function profileFor(it){
  var name=(it[1]||"").toLowerCase();
  var base=null;
  for (var i=0;i<PROFILES.length;i++){ if (name.indexOf(PROFILES[i][0])>=0){ base=PROFILES[i][1]; break; } }
  var aug=AUG_BY_CODE[it[0]] || augFor(name);
  var stack=stackFor(name);   // blend rationale + fixed-ratio dosing
  var warn=warnFor(name);     // interactions to avoid
  // If there's nothing to add at all, return the base as-is.
  if(!aug && !stack && !warn) return base;
  // shallow-clone the base so we never mutate the shared PROFILES object
  var out={};
  if(base){ for(var k in base) out[k]=base[k]; }
  if(aug){
    if(aug.chem) out.chem=aug.chem;
    if(aug.run)  out.run=aug.run;
    if(aug.stack) out.stack=aug.stack;
    if(aug.warn)  out.warn=aug.warn;
    if(aug.extraS){ out.s=(out.s||[]).concat(aug.extraS); }
    if(aug.extraP){ out.p=(out.p||[]).concat(aug.extraP); }
  }
  // dedicated layers win for their field (single source of truth for stack/warn)
  if(stack) out.stack=stack;
  if(warn)  out.warn=warn;
  return out;
}

var ESTROGEN_ESTER_GUARD = ["cypionate","enanthate","propionate","undecanoate"];
function purposesFor(it){
  var name = (it[1] || "").toLowerCase();
  var isEstradiol = name.indexOf("estradiol")>=0;
  var tags = [];
  for (var i=0;i<PURPOSE_KW.length;i++){
    var kw = PURPOSE_KW[i][0];
    if (name.indexOf(kw)>=0){
      if (isEstradiol && ESTROGEN_ESTER_GUARD.indexOf(kw)>=0) continue; // don't inherit test tags
      var ts = PURPOSE_KW[i][1];
      for (var j=0;j<ts.length;j++){ if (tags.indexOf(ts[j])<0) tags.push(ts[j]); }
    }
  }
  return tags;
}

// flat lookup
var BYCODE = {};
CATS.forEach(function(c){ CATALOG[c].items.forEach(function(it){ BYCODE[it[0]] = {it:it, cat:c}; }); });

// purpose index: purpose -> [{it,cat}], preserving catalog order; only purposes with items appear
var PURPOSE_INDEX = {};
CATS.forEach(function(c){
  CATALOG[c].items.forEach(function(it){
    purposesFor(it).forEach(function(p){
      (PURPOSE_INDEX[p] = PURPOSE_INDEX[p] || []).push({it:it, cat:c});
    });
  });
});
var PURPOSES_PRESENT = PURPOSE_ORDER.filter(function(p){ return PURPOSE_INDEX[p] && PURPOSE_INDEX[p].length; });
state.purpose = PURPOSES_PRESENT[0];

// ---- primary purpose for cart/manifest grouping ----
// An item can carry several purpose tags (Tirzepatide is metabolic; a test ester
// is both Muscle and TRT). The cart and manifest must place each item ONCE, so we
// pick a single primary: the first purpose in PURPOSE_ORDER that the item matches.
// Anything with no purpose match falls into "Other / Research" so it can't vanish.
function primaryPurpose(it){
  var tags = purposesFor(it);
  for (var i=0;i<PURPOSE_ORDER.length;i++){
    if (tags.indexOf(PURPOSE_ORDER[i])>=0) return PURPOSE_ORDER[i];
  }
  return "Other / Research";
}

// Group a set of priced cart lines into [{purpose, lines:[...]}], with groups in
// PURPOSE_ORDER and lines inside each sorted alphabetically by product name
// (then code, so two sizes of the same product keep a stable order).
function groupByPurpose(L){
  var buckets = {};
  L.forEach(function(l){
    var p = primaryPurpose(l.it);
    (buckets[p] = buckets[p] || []).push(l);
  });
  var byName = function(a,b){
    return a.it[1].toLowerCase().localeCompare(b.it[1].toLowerCase())
        || a.code.localeCompare(b.code);
  };
  var out = [];
  PURPOSE_ORDER.forEach(function(p){
    if (buckets[p] && buckets[p].length){
      out.push({ purpose:p, lines: buckets[p].slice().sort(byName) });
    }
  });
  return out;
}

// ---- sheet-order grouping (the vendor's own layout) ----
// The CSR reads against the original price sheet, so the cart and manifest match
// it exactly: grouped by the four catalog sections in sheet order (Peptides,
// Orals, Injectable Oils, Cartridges), and within each section kept in the
// vendor's own row sequence — NOT alphabetised, NOT by purpose. CAT_POS records
// each code's index in its section array so a cart of mixed items re-sorts back
// into sheet order.
var CAT_POS = {};
CATS.forEach(function(c){
  CATALOG[c].items.forEach(function(it, i){ CAT_POS[it[0]] = i; });
});
function groupBySheet(L){
  var buckets = {};
  L.forEach(function(l){ (buckets[l.cat] = buckets[l.cat] || []).push(l); });
  var bySheet = function(a,b){ return (CAT_POS[a.code]||0) - (CAT_POS[b.code]||0); };
  var out = [];
  CATS.forEach(function(c){                       // CATS is already sheet order
    if (buckets[c] && buckets[c].length){
      out.push({ purpose:c, lines: buckets[c].slice().sort(bySheet) });
    }
  });
  return out;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function currentRows(){
  // returns array of {it, cat, badge}
  var q = state.q.trim().toLowerCase();
  // Favorites view: every starred product, in catalog order, with a form badge.
  if (state.browse==="favorites" && !q){
    var favOut=[];
    CATS.forEach(function(c){
      CATALOG[c].items.forEach(function(it){
        if (isFav(it[0])) favOut.push({it:it, cat:c, badge:true});
      });
    });
    return favOut;
  }
  // Raws tab only exists in form-browse mode
  if (state.browse==="form" && state.cat === "__raws"){
    return RAWS.filter(function(r){ return !q || (r[0]+" "+r[1]).toLowerCase().indexOf(q)>=0; })
               .map(function(r){ return {raw:r}; });
  }
  if (q){
    var out=[];
    CATS.forEach(function(c){
      CATALOG[c].items.forEach(function(it){
        if ((it[0]+" "+it[1]+" "+(it[5]||"")).toLowerCase().indexOf(q)>=0) out.push({it:it, cat:c, badge:true});
      });
    });
    return out;
  }
  if (state.browse==="purpose"){
    var list = PURPOSE_INDEX[state.purpose] || [];
    // show the form category as the badge so the buyer knows what format it is
    return list.map(function(r){ return {it:r.it, cat:r.cat, badge:true}; });
  }
  return CATALOG[state.cat].items.map(function(it){ return {it:it, cat:state.cat, badge:false}; });
}

// Price a product against an explicit bulk flag (defaults to the live one).
// Saved orders remember the tier they were built at, so their totals stay right
// even if you toggle the live 10+ switch afterward.
function priceOfWith(it, useBulk){ var p=it[3], pb=it[4]; return (useBulk && pb!=null) ? pb : p; }

// Build priced line items from any qty map + bulk flag. The live cart is just
// linesFrom(state.qty, state.useBulk); saved orders pass their own stored values.
function linesFrom(qtyMap, useBulk){
  var out=[];
  for (var code in qtyMap){
    var n = qtyMap[code]; if (!(n>0)) continue;
    var rec = BYCODE[code]; if (!rec) continue;
    var pr = priceOfWith(rec.it, useBulk); if (pr==null) continue;
    out.push({code:code, n:n, it:rec.it, cat:rec.cat, price:pr, total:pr*n});
  }
  return out;
}
function lines(){ return linesFrom(state.qty, state.useBulk); }

      if (state.browse==="form" && (state.cat==null || state.cat==="__raws")) state.cat = CATS[0];

}
